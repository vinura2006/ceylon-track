<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journey Watch — Ceylon Track</title>
    <link rel="stylesheet" href="/css/theme.css?v=4">
    <script src="/js/theme-loader.js"></script>
    

    <style>
        /* Watch Layout */
        .watch-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            flex: 1;
        }

        .watch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .watch-title-block h1 {
            font-size: 2.25rem;
            line-height: 1.2;
        }
        .watch-title-block p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .watch-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        /* Card Design */
        .watch-card {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border-left: 6px solid var(--accent);
            position: relative;
            opacity: 1;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .watch-card.fade-out {
            opacity: 0;
            transform: scale(0.9);
        }

        .time-display {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-hover);
        }

        /* Pulsing Status Badge Animation */
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(217, 119, 6, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0); }
        }
        @keyframes pulse-border-danger {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .badge-pulse-warning {
            animation: pulse-border 1.5s infinite;
        }
        .badge-pulse-danger {
            animation: pulse-border-danger 1.5s infinite;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            grid-column: span 2;
        }

        .empty-icon {
            font-size: 4rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .watch-grid {
                grid-template-columns: 1fr;
            }
            .empty-state {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="navbar-brand">
                <i class="fa-solid fa-train"></i> Ceylon Track
            </a>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">☰</button>
            <ul class="navbar-links" id="nav-links">
                <!-- Populated dynamically by api.js -->
            </ul>
        </div>
    </nav>

    <main class="watch-container">
        
        <div class="watch-header">
            <div class="watch-title-block">
                <h1>My Journey Watch</h1>
                <p>Real-time status updates of trains you're monitoring</p>
            </div>
            <button class="btn btn-secondary" id="refreshBtn">
                🔄 Refresh
            </button>
        </div>

        <div class="watch-grid" id="watchGrid">
            <!-- Watches injected here -->
        </div>

    </main>

    <footer>
        <p>© 2026 Ceylon Track — Sri Lanka Railway Passenger Portal</p>
    </footer>

    <script src="/js/api.js"></script>
    <script>
        // Check Passenger Role
        if (!window.api.requireRole('passenger')) {
            throw new Error('Access denied. Passenger role required.');
        }

        // Dynamically load nav links
        window.api.updateNav();

        // Mobile Nav Toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                const navLinks = document.getElementById('nav-links');
                navLinks.classList.toggle('open');
                mobileMenuBtn.textContent = navLinks.classList.contains('open') ? '✕' : '☰';
            });
        }

        // Load Watches
        async function fetchWatches() {
            window.api.showSpinner();
            try {
                const res = await window.api.getWatches();
                const watches = res.watches || [];
                renderWatches(watches);
            } catch (err) {
                window.api.showToast(err.message || 'Failed to load watches', 'error');
            } finally {
                window.api.hideSpinner();
            }
        }

        // Remove Watch
        async function removeWatchItem(watchId, btn) {
            try {
                btn.disabled = true;
                await window.api.removeWatch(watchId);
                window.api.showToast('Train removed from watch list', 'success');
                
                const card = btn.closest('.watch-card');
                card.classList.add('fade-out');
                setTimeout(() => {
                    fetchWatches();
                }, 500);
            } catch (err) {
                btn.disabled = false;
                window.api.showToast(err.message || 'Remove failed', 'error');
            }
        }

        // Format times
        function formatTime(t) {
            return t ? t.slice(0, 5) : '';
        }

        // Render Watches
        function renderWatches(watches) {
            const container = document.getElementById('watchGrid');
            container.innerHTML = '';

            if (watches.length === 0) {
                container.innerHTML = `
                    <div class="empty-state card">
                        <div class="empty-icon">🚂</div>
                        <h3>You're not watching any trains yet</h3>
                        <p>Search for a train and subscribe to receive real-time alerts.</p>
                        <a href="index.html" class="btn btn-primary">Find Trains</a>
                    </div>
                `;
                return;
            }

            watches.forEach(w => {
                const card = document.createElement('div');
                card.className = 'card watch-card';

                let statusBadge = 'badge-success';
                let pulseClass = '';
                if (w.liveStatus === 'DELAYED') {
                    statusBadge = 'badge-warning';
                    pulseClass = 'badge-pulse-warning';
                } else if (w.liveStatus === 'CANCELLED') {
                    statusBadge = 'badge-danger';
                    pulseClass = 'badge-pulse-danger';
                }

                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
                        <div>
                            <h3 style="font-weight: 800;">Train ${w.trainNumber}</h3>
                            <p style="color: var(--text-2); font-weight: 600; font-size: 0.9rem; margin-top: 0.25rem;">
                                ${w.fromStation} ➔ ${w.toStation}
                            </p>
                        </div>
                        <span class="badge ${statusBadge} ${pulseClass}">${w.liveStatus.replace('_', ' ')}</span>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin: 0.5rem 0;">
                        <div>
                            <div class="time-display">${formatTime(w.departureTime)}</div>
                            <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-2);">Scheduled Dep</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="time-display" style="color: var(--text-2);">${formatTime(w.arrivalTime)}</div>
                            <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-2);">Scheduled Arr</div>
                        </div>
                    </div>

                    ${w.liveStatus === 'DELAYED' ? `
                        <div style="background-color: rgba(217, 119, 6, 0.1); border: 1px solid var(--warning); color: var(--warning); padding: 0.5rem 1rem; border-radius: 8px; font-weight: 700; font-size: 0.9rem; text-align: center;">
                            ⚠️ Delayed: +${w.delayMinutes}m
                        </div>
                    ` : ''}

                    <button class="btn btn-danger" style="width: 100%; margin-top: 0.5rem;" onclick="removeWatchItem(${w.id}, this)">
                        Remove from Watch
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // On Load
        window.addEventListener('load', () => {
            fetchWatches();
            
            // Refresh handlers
            document.getElementById('refreshBtn').addEventListener('click', fetchWatches);
            
            // Auto refresh
            setInterval(fetchWatches, 60000);
        });
    </script>
</body>
</html>
