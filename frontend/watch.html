<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journey Watch — Ceylon Track</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    
    <!-- Theme Detection Script -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('ceylon_track_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <style>
        /* ============================================================
           CEYLON TRACK GLOBAL DESIGN SYSTEM
           ============================================================ */
        :root {
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --surface-2: #F1F5F9;
            --text: #0F172A;
            --text-2: #475569;
            --border: #E2E8F0;
            --primary: #0F4C75;
            --primary-2: #1B6CA8;
            --accent: #00B4D8;
            --accent-2: #0077B6;
            --success: #059669;
            --warning: #D97706;
            --danger: #DC2626;
            --shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-blur: blur(8px);
            --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Syne', sans-serif;
        }

        [data-theme="dark"] {
            --bg: #0A0F1E;
            --surface: #111827;
            --surface-2: #1F2937;
            --text: #F9FAFB;
            --text-2: #9CA3AF;
            --border: #374151;
            --primary: #1B6CA8;
            --primary-2: #2196F3;
            --accent: #00D4FF;
            --accent-2: #00B4D8;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            --glass-bg: rgba(17, 24, 39, 0.65);
            --glass-blur: blur(12px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: 700;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: var(--accent-2);
        }

        /* Nav & Header */
        header {
            background-color: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 800;
            font-family: var(--font-display);
            color: var(--text);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--text-2);
            font-weight: 600;
            font-size: 0.95rem;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        .theme-btn, .menu-toggle-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.25rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .theme-btn:hover {
            background-color: var(--surface-2);
        }

        .menu-toggle-btn {
            display: none;
        }

        /* Mobile Dropdown Nav */
        .mobile-nav {
            display: none;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            flex-direction: column;
            gap: 1rem;
        }
        .mobile-nav a {
            font-weight: 600;
            color: var(--text-2);
        }
        .mobile-nav.open {
            display: flex;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            min-height: 48px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background-color: var(--primary-2);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background-color: var(--border);
        }

        .btn-danger {
            background-color: var(--danger);
            color: #FFFFFF;
        }
        .btn-danger:hover {
            opacity: 0.9;
        }

        /* Cards */
        .card {
            background-color: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 2rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.35rem 0.75rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-success { background-color: rgba(5, 150, 105, 0.15); color: var(--success); }
        .badge-warning { background-color: rgba(217, 119, 6, 0.15); color: var(--warning); }
        .badge-danger { background-color: rgba(220, 38, 38, 0.15); color: var(--danger); }

        /* Watch Layout */
        .watch-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            flex: 1;
        }

        .watch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .watch-title-block h1 {
            font-size: 2.25rem;
            line-height: 1.2;
        }
        .watch-title-block p {
            color: var(--text-2);
            font-size: 1.1rem;
        }

        .watch-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        /* Card Design */
        .watch-card {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border-left: 6px solid var(--primary);
            position: relative;
            opacity: 1;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .watch-card.fade-out {
            opacity: 0;
            transform: scale(0.9);
        }

        .time-display {
            font-size: 2rem;
            font-weight: 800;
            font-family: var(--font-display);
            color: var(--primary-2);
        }

        /* Pulsing Status Badge Animation */
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(217, 119, 6, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0); }
        }
        @keyframes pulse-border-danger {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .badge-pulse-warning {
            animation: pulse-border 1.5s infinite;
        }
        .badge-pulse-danger {
            animation: pulse-border-danger 1.5s infinite;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            grid-column: span 2;
        }

        .empty-icon {
            font-size: 4rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--text-2);
            font-size: 0.85rem;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .watch-grid {
                grid-template-columns: 1fr;
            }
            .empty-state {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo-container">
                <span>🚂</span> Ceylon Track
            </a>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Search</a>
                <a href="watch.html" class="active">My Watches</a>
                <a href="gps-demo.html">GPS Demo 🛰</a>
                <a href="login.html" id="authLink">Login</a>
                <button class="theme-btn" id="themeBtn">🌓</button>
            </div>
            <button class="menu-toggle-btn" id="menuToggleBtn">☰</button>
        </div>
    </header>

    <div class="mobile-nav" id="mobileNav">
        <a href="index.html">Search</a>
        <a href="watch.html" class="active">My Watches</a>
        <a href="gps-demo.html">GPS Demo 🛰</a>
        <a href="login.html" id="authLinkMobile">Login</a>
        <button class="btn btn-secondary" id="themeBtnMobile">Toggle Theme 🌓</button>
    </div>

    <main class="watch-container">
        
        <div class="watch-header">
            <div class="watch-title-block">
                <h1>My Journey Watch</h1>
                <p>Real-time status updates of trains you're monitoring</p>
            </div>
            <button class="btn btn-secondary" id="refreshBtn">
                🔄 Refresh
            </button>
        </div>

        <div class="watch-grid" id="watchGrid">
            <!-- Watches injected here -->
        </div>

    </main>

    <footer>
        <p>© 2026 Ceylon Track — Sri Lanka Railway Passenger Portal</p>
    </footer>

    <script src="/js/api.js"></script>
    <script>
        // Check Auth
        window.api.requireAuth();

        // Update Nav Auth Links
        const user = window.api.getUser();
        if (user) {
            const authLink = document.getElementById('authLink');
            const authLinkMobile = document.getElementById('authLinkMobile');
            authLink.outerHTML = `<a href="#" onclick="window.api.logout(); return false;">Logout</a>`;
            authLinkMobile.outerHTML = `<a href="#" onclick="window.api.logout(); return false;">Logout</a>`;
            
            if (user.role === 'staff' || user.role === 'admin') {
                const navLinks = document.getElementById('navLinks');
                const adminNode = document.createElement('a');
                adminNode.href = 'admin.html';
                adminNode.textContent = 'Dashboard 📊';
                navLinks.insertBefore(adminNode, document.getElementById('themeBtn'));
            }
        }

        // Mobile Nav & Theme logic
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const mobileNav = document.getElementById('mobileNav');
        menuToggleBtn.addEventListener('click', () => mobileNav.classList.toggle('open'));

        const themeBtn = document.getElementById('themeBtn');
        const themeBtnMobile = document.getElementById('themeBtnMobile');
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('ceylon_track_theme', newTheme);
        }
        themeBtn.addEventListener('click', toggleTheme);
        themeBtnMobile.addEventListener('click', toggleTheme);

        // Load Watches
        async function fetchWatches() {
            window.api.showSpinner();
            try {
                const res = await window.api.getWatches();
                const watches = res.watches || [];
                renderWatches(watches);
            } catch (err) {
                window.api.showToast(err.message || 'Failed to load watches', 'error');
            } finally {
                window.api.hideSpinner();
            }
        }

        // Remove Watch
        async function removeWatchItem(watchId, btn) {
            try {
                btn.disabled = true;
                await window.api.removeWatch(watchId);
                window.api.showToast('Train removed from watch list', 'success');
                
                const card = btn.closest('.watch-card');
                card.classList.add('fade-out');
                setTimeout(() => {
                    fetchWatches();
                }, 500);
            } catch (err) {
                btn.disabled = false;
                window.api.showToast(err.message || 'Remove failed', 'error');
            }
        }

        // Format times
        function formatTime(t) {
            return t ? t.slice(0, 5) : '';
        }

        // Render Watches
        function renderWatches(watches) {
            const container = document.getElementById('watchGrid');
            container.innerHTML = '';

            if (watches.length === 0) {
                container.innerHTML = `
                    <div class="empty-state card">
                        <div class="empty-icon">🚂</div>
                        <h3>You're not watching any trains yet</h3>
                        <p>Search for a train and subscribe to receive real-time alerts.</p>
                        <a href="index.html" class="btn btn-primary">Find Trains</a>
                    </div>
                `;
                return;
            }

            watches.forEach(w => {
                const card = document.createElement('div');
                card.className = 'card watch-card';

                let statusBadge = 'badge-success';
                let pulseClass = '';
                if (w.liveStatus === 'DELAYED') {
                    statusBadge = 'badge-warning';
                    pulseClass = 'badge-pulse-warning';
                } else if (w.liveStatus === 'CANCELLED') {
                    statusBadge = 'badge-danger';
                    pulseClass = 'badge-pulse-danger';
                }

                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
                        <div>
                            <h3 style="font-weight: 800;">Train ${w.trainNumber}</h3>
                            <p style="color: var(--text-2); font-weight: 600; font-size: 0.9rem; margin-top: 0.25rem;">
                                ${w.fromStation} ➔ ${w.toStation}
                            </p>
                        </div>
                        <span class="badge ${statusBadge} ${pulseClass}">${w.liveStatus.replace('_', ' ')}</span>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin: 0.5rem 0;">
                        <div>
                            <div class="time-display">${formatTime(w.departureTime)}</div>
                            <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-2);">Scheduled Dep</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="time-display" style="color: var(--text-2);">${formatTime(w.arrivalTime)}</div>
                            <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-2);">Scheduled Arr</div>
                        </div>
                    </div>

                    ${w.liveStatus === 'DELAYED' ? `
                        <div style="background-color: rgba(217, 119, 6, 0.1); border: 1px solid var(--warning); color: var(--warning); padding: 0.5rem 1rem; border-radius: 8px; font-weight: 700; font-size: 0.9rem; text-align: center;">
                            ⚠️ Delayed: +${w.delayMinutes}m
                        </div>
                    ` : ''}

                    <button class="btn btn-danger" style="width: 100%; margin-top: 0.5rem;" onclick="removeWatchItem(${w.id}, this)">
                        Remove from Watch
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // On Load
        window.addEventListener('load', () => {
            fetchWatches();
            
            // Refresh handlers
            document.getElementById('refreshBtn').addEventListener('click', fetchWatches);
            
            // Auto refresh
            setInterval(fetchWatches, 60000);
        });
    </script>
</body>
</html>
