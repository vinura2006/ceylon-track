<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Timetable - Ceylon Track</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <script src="/js/theme-loader.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-app); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 1200px; margin: 3rem auto; padding: 0 1.5rem; }
        .page-header { text-align: center; margin-bottom: 3rem; }
        .page-header h2 { font-size: 2.25rem; margin-bottom: 1rem; }
        .page-header p { color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }
        .timetable-card { background: var(--bg-surface); border-radius: 16px; box-shadow: var(--shadow-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: var(--bg-elevated); padding: 1.25rem 1rem; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
        td { padding: 1.25rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: var(--bg-elevated); }
        .train-name { font-weight: 700; color: var(--accent); display: block; font-size: 1.05rem; margin-bottom: 0.25rem; }
        .train-no { font-size: 0.8rem; color: var(--text-secondary); background: var(--bg-elevated); padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 600; }
        .time-block { font-weight: 700; font-size: 1.1rem; color: var(--text-primary); }
        .class-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.5rem; border-radius: 999px; background: rgba(245,158,11,0.2); color: var(--warning); border: 1px solid var(--warning); }
        .btn-book { background: var(--accent); color: var(--text-inverse); border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; box-shadow: var(--shadow-sm); }
        .btn-book:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .loading-state { text-align: center; padding: 4rem; color: var(--text-secondary); font-size: 1.1rem; }
        .error-state { text-align: center; padding: 2rem; color: var(--danger); }
        .retry-btn { display: inline-block; margin-top: 1rem; padding: 0.5rem 1.5rem; background: var(--accent); color: var(--text-inverse); border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 0.5rem; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="navbar-brand">
                <i class="fa-solid fa-train"></i> Ceylon Track
            </a>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">☰</button>
            <ul class="navbar-links" id="nav-links">
                <!-- Nav populated dynamically by api.js -->
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Official Train Timetable</h2>
            <p>Browse the latest schedules and book tickets directly through the official Sri Lanka Railways Pravesha portal.</p>
        </div>

        <div class="timetable-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Train</th>
                            <th>Route</th>
                            <th>Departure</th>
                            <th>Arrival</th>
                            <th>Classes</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="timetableBody">
                        <tr>
                            <td colspan="6" class="loading-state">
                                <span class="spinner"></span> Loading timetables...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        function formatTime(timeStr) {
            if (!timeStr) return '--:--';
            var parts = String(timeStr).split(':');
            var h = parseInt(parts[0], 10);
            var m = parts[1] || '00';
            var ampm = h >= 12 ? 'PM' : 'AM';
            var h12 = h % 12 || 12;
            return String(h12).padStart(2, '0') + ':' + m + ' ' + ampm;
        }

        async function loadTimetable() {
            var tbody = document.getElementById('timetableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="loading-state"><span class="spinner"></span> Loading timetables...</td></tr>';

            try {
                var res = await window.api.getTimetables();
                tbody.innerHTML = '';

                var timetables = res.timetables || res || [];
                if (!timetables.length) {
                    tbody.innerHTML = '<tr><td colspan="6" class="loading-state">No timetables available. Please check back later.</td></tr>';
                    return;
                }

                timetables.forEach(function(t) {
                    var tr = document.createElement('tr');
                    tr.innerHTML = '<td><span class="train-name">' + (t.trainName || 'Unknown Train') + '</span><span class="train-no"><i class="fa-solid fa-hashtag"></i> ' + (t.trainNo || '') + '</span></td>'
                        + '<td><div style="display:flex;flex-direction:column;gap:0.25rem;"><span><i class="fa-regular fa-circle-dot" style="color:var(--accent);font-size:0.8rem;"></i> ' + (t.fromStation || '') + '</span><span><i class="fa-solid fa-location-dot" style="color:var(--danger);font-size:0.8rem;"></i> ' + (t.toStation || '') + '</span></div></td>'
                        + '<td class="time-block">' + formatTime(t.departureTime) + '</td>'
                        + '<td class="time-block">' + formatTime(t.arrivalTime) + '</td>'
                        + '<td><span class="class-badge"><i class="fa-solid fa-couch"></i> ' + (t.trainClass || 'N/A') + '</span><br><span style="font-size:0.8rem;color:var(--text-secondary);margin-top:0.25rem;display:inline-block;">' + (t.frequency || '') + '</span></td>'
                        + '<td><button class="btn-book" onclick="bookTicket(' + t.id + ')"><i class="fa-solid fa-ticket"></i> Book on Pravesha</button></td>';
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error('Timetable load error:', err);
                tbody.innerHTML = '<tr><td colspan="6" class="error-state"><p>Failed to load timetables.</p><p style="font-size:0.9rem;margin-top:0.5rem;">' + (err.message || 'Network error') + '</p><button class="retry-btn" onclick="loadTimetable()"><i class="fa-solid fa-rotate-right"></i> Retry</button></td></tr>';
            }
        }

        async function bookTicket(timetableId) {
            try {
                if (window.api.isLoggedIn()) {
                    await window.api.bookTicket(timetableId);
                }
            } catch(e) {}
            window.open('https://seatreservation.railway.gov.lk/mtktwebslr/', '_blank');
        }

        if (window.api) { window.api.updateNav(); }
        loadTimetable();
    </script>
</body>
</html>
