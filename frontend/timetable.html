<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Timetable - Ceylon Track</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #f8fafc;
            --surface-light: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --primary: #0F4C75;
            --secondary: #3282B8;
            --accent: #BBE1FA;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
        }

        .navbar {
            background: var(--surface-light);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.5rem;
            font-family: 'Syne', sans-serif;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--text-dark);
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .timetable-card {
            background: var(--surface-light);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid var(--border-light);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
            padding: 1.25rem 1rem;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-light);
        }

        td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .train-name {
            font-weight: 700;
            color: var(--primary);
            display: block;
            font-size: 1.05rem;
            margin-bottom: 0.25rem;
        }

        .train-no {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: #e2e8f0;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .station-block {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .time-block {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-dark);
        }

        .class-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }

        .btn-book {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        .btn-book:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
        }

        .loading-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <h1><i class="fa-solid fa-train"></i> Ceylon Track</h1>
        <ul class="nav-links" id="nav-links">
            <!-- Nav populated by api.js -->
        </ul>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Official Train Timetable</h2>
            <p>Browse the latest schedules and book tickets directly through the official Sri Lanka Railways Pravesha portal.</p>
        </div>

        <div class="timetable-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Train</th>
                            <th>Route</th>
                            <th>Departure</th>
                            <th>Arrival</th>
                            <th>Classes</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="timetableBody">
                        <tr>
                            <td colspan="6" class="loading-state">
                                <i class="fa-solid fa-spinner fa-spin" style="margin-right: 0.5rem;"></i> Loading timetables...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            api.updateNav();
            
            try {
                const res = await api.getTimetables();
                const tbody = document.getElementById('timetableBody');
                tbody.innerHTML = '';

                if (!res.timetables || res.timetables.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="loading-state">No timetables available at the moment.</td></tr>`;
                    return;
                }

                res.timetables.forEach(t => {
                    const tr = document.createElement('tr');
                    
                    // Format time helper
                    const formatTime = (timeStr) => {
                        if(!timeStr) return '--:--';
                        // Convert "05:55:00" to "05:55 AM"
                        const [hours, minutes] = timeStr.split(':');
                        const h = parseInt(hours, 10);
                        const ampm = h >= 12 ? 'PM' : 'AM';
                        const h12 = h % 12 || 12;
                        return `${h12.toString().padStart(2, '0')}:${minutes} ${ampm}`;
                    };

                    tr.innerHTML = `
                        <td>
                            <span class="train-name">${t.trainName || 'Unknown Train'}</span>
                            <span class="train-no"><i class="fa-solid fa-hashtag"></i> ${t.trainNo}</span>
                        </td>
                        <td>
                            <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                                <span class="station-block"><i class="fa-regular fa-circle-dot" style="color: var(--secondary); font-size: 0.8rem;"></i> ${t.fromStation}</span>
                                <span class="station-block"><i class="fa-solid fa-location-dot" style="color: var(--danger); font-size: 0.8rem;"></i> ${t.toStation}</span>
                            </div>
                        </td>
                        <td class="time-block">${formatTime(t.departureTime)}</td>
                        <td class="time-block">${formatTime(t.arrivalTime)}</td>
                        <td>
                            <span class="class-badge"><i class="fa-solid fa-couch"></i> ${t.trainClass}</span><br>
                            <span style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; display: inline-block;">${t.frequency}</span>
                        </td>
                        <td>
                            <button class="btn-book" onclick="bookTicket(${t.id})">
                                <i class="fa-solid fa-ticket"></i> Book on Pravesha
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('timetableBody').innerHTML = `<tr><td colspan="6" class="loading-state" style="color: var(--danger);">Failed to load timetables. Please try again later.</td></tr>`;
            }
        });

        async function bookTicket(timetableId) {
            try {
                if(api.isLoggedIn()) {
                    await api.bookTicket(timetableId);
                }
                // Redirect to Pravesha Official Site
                window.open('https://seatreservation.railway.gov.lk/mtktwebslr/', '_blank');
            } catch(e) {
                console.error('Failed to log booking', e);
                // Redirect anyway
                window.open('https://seatreservation.railway.gov.lk/mtktwebslr/', '_blank');
            }
        }
    </script>
</body>
</html>
