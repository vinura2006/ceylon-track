<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results — Ceylon Track</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    
    <!-- Theme Detection Script -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('ceylon_track_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <style>
        /* ============================================================
           CEYLON TRACK GLOBAL DESIGN SYSTEM
           ============================================================ */
        :root {
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --surface-2: #F1F5F9;
            --text: #0F172A;
            --text-2: #475569;
            --border: #E2E8F0;
            --primary: #0F4C75;
            --primary-2: #1B6CA8;
            --accent: #00B4D8;
            --accent-2: #0077B6;
            --success: #059669;
            --warning: #D97706;
            --danger: #DC2626;
            --shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-blur: blur(8px);
            --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Syne', sans-serif;
        }

        [data-theme="dark"] {
            --bg: #0A0F1E;
            --surface: #111827;
            --surface-2: #1F2937;
            --text: #F9FAFB;
            --text-2: #9CA3AF;
            --border: #374151;
            --primary: #1B6CA8;
            --primary-2: #2196F3;
            --accent: #00D4FF;
            --accent-2: #00B4D8;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            --glass-bg: rgba(17, 24, 39, 0.65);
            --glass-blur: blur(12px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: 700;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: var(--accent-2);
        }

        /* Nav & Header */
        header {
            background-color: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 800;
            font-family: var(--font-display);
            color: var(--text);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--text-2);
            font-weight: 600;
            font-size: 0.95rem;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        .theme-btn, .menu-toggle-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.25rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .theme-btn:hover {
            background-color: var(--surface-2);
        }

        .menu-toggle-btn {
            display: none;
        }

        /* Mobile Dropdown Nav */
        .mobile-nav {
            display: none;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            flex-direction: column;
            gap: 1rem;
        }
        .mobile-nav a {
            font-weight: 600;
            color: var(--text-2);
        }
        .mobile-nav.open {
            display: flex;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            min-height: 48px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background-color: var(--primary-2);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background-color: var(--border);
        }

        .btn-danger {
            background-color: var(--danger);
            color: #FFFFFF;
        }
        .btn-danger:hover {
            opacity: 0.9;
        }

        .btn-ghost {
            background: none;
            color: var(--text-2);
        }
        .btn-ghost:hover {
            background-color: var(--surface-2);
            color: var(--text);
        }

        /* Cards */
        .card {
            background-color: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 2rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* Inputs & Selects */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-2);
        }

        .input, .select {
            width: 100%;
            min-height: 48px;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--surface);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .input:focus, .select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.15);
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.35rem 0.75rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-success { background-color: rgba(5, 150, 105, 0.15); color: var(--success); }
        .badge-warning { background-color: rgba(217, 119, 6, 0.15); color: var(--warning); }
        .badge-danger { background-color: rgba(220, 38, 38, 0.15); color: var(--danger); }
        .badge-neutral { background-color: var(--surface-2); color: var(--text-2); }

        /* ============================================================
           RESULTS CONTENT ELEMENTS
           ============================================================ */
        .results-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex: 1;
        }

        .compact-search-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr auto;
            gap: 0.75rem;
            align-items: flex-end;
            background-color: var(--surface);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .results-count {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }

        .sort-filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .class-tabs {
            display: flex;
            gap: 0.25rem;
            background-color: var(--surface-2);
            padding: 0.25rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .class-tab {
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            background: none;
            border: none;
            color: var(--text-2);
            cursor: pointer;
            transition: all 0.2s;
        }
        .class-tab.active {
            background-color: var(--surface);
            color: var(--text);
            box-shadow: var(--shadow);
        }

        /* Train Card Specifics */
        .train-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .train-card {
            border-left: 6px solid var(--success);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1.5rem;
        }
        .train-card.ON_TIME { border-left-color: var(--success); }
        .train-card.DELAYED { border-left-color: var(--warning); }
        .train-card.CANCELLED { border-left-color: var(--danger); }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .train-title {
            font-size: 1.25rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-middle {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin: 0.5rem 0;
        }

        .time-block {
            display: flex;
            flex-direction: column;
        }
        .time-large {
            font-size: 1.75rem;
            font-weight: 800;
            font-family: var(--font-display);
            color: var(--primary-2);
        }
        .station-sub {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-2);
        }

        .route-path-line {
            flex: 1;
            height: 2px;
            background-color: var(--border);
            position: relative;
            min-width: 50px;
        }
        .route-path-line::after {
            content: '➔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-2);
            font-size: 0.75rem;
            background-color: var(--surface);
            padding: 0 0.25rem;
        }

        .metadata-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .delay-banner {
            background-color: rgba(217, 119, 6, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }
        .card-actions .btn {
            flex: 1;
        }

        /* Stops Accordion */
        .stops-accordion {
            background-color: var(--surface-2);
            border-radius: 8px;
            padding: 1rem;
            display: none;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }
        .stops-accordion.open {
            display: flex;
        }

        .stop-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
        .stop-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .stop-time-label {
            font-weight: 700;
            color: var(--primary-2);
            width: 80px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .empty-train-icon {
            font-size: 4rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ============================================================
           RESPONSIVE OVERRIDES
           ============================================================ */
        @media (max-width: 768px) {
            .compact-search-bar {
                grid-template-columns: 1fr;
            }
            .card-actions {
                flex-direction: column;
            }
            .route-path-line {
                display: none;
            }
            .card-middle {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo-container">
                <span>🚂</span> Ceylon Track
            </a>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Search</a>
                <a href="live-map.html">🗺 Live Map</a>
                <a href="watch.html">My Watches</a>
                <a href="gps-demo.html">GPS Demo 🛰</a>
                <a href="login.html" id="authLink">Login</a>
                <button class="theme-btn" id="themeBtn">🌓</button>
            </div>
            <button class="menu-toggle-btn" id="menuToggleBtn">☰</button>
        </div>
    </header>

    <div class="mobile-nav" id="mobileNav">
        <a href="index.html">Search</a>
        <a href="live-map.html">🗺 Live Map</a>
        <a href="watch.html">My Watches</a>
        <a href="gps-demo.html">GPS Demo 🛰</a>
        <a href="login.html" id="authLinkMobile">Login</a>
        <button class="btn btn-secondary" id="themeBtnMobile">Toggle Theme 🌓</button>
    </div>

    <main class="results-container">
        
        <!-- Compact Search Bar -->
        <form class="compact-search-bar" id="compactSearchForm">
            <div class="input-group">
                <label for="fromInput">From</label>
                <input type="text" id="fromInput" class="input" placeholder="From Station" required>
            </div>
            <div class="input-group">
                <label for="toInput">To</label>
                <input type="text" id="toInput" class="input" placeholder="To Station" required>
            </div>
            <div class="input-group">
                <label for="dateInput">Date</label>
                <input type="date" id="dateInput" class="input" required>
            </div>
            <div class="input-group">
                <label for="classSelect">Class</label>
                <select id="classSelect" class="select">
                    <option value="all">All Classes</option>
                    <option value="1st">1st Class</option>
                    <option value="2nd">2nd Class</option>
                    <option value="3rd">3rd Class</option>
                    <option value="mixed">Mixed</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>

        <!-- Results Info & Sort/Filter Header -->
        <div id="errorBanner" style="color: var(--danger); background: rgba(220, 38, 38, 0.1); border: 1px solid var(--danger); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; text-align: center; font-weight: 700; display: none;"></div>
        
        <div class="results-info">
            <div class="results-count" id="resultsCount">Searching for trains...</div>
            
            <div class="sort-filter-row">
                <div class="input-group" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                    <label for="sortSelect" style="margin: 0; white-space: nowrap;">Sort By</label>
                    <select id="sortSelect" class="select" style="min-height: 38px; padding: 0.25rem 0.5rem; font-size: 0.85rem;">
                        <option value="departure">Departure Time</option>
                        <option value="reliability">Reliability</option>
                    </select>
                </div>

                <div class="class-tabs">
                    <button class="class-tab active" data-tab="all">All</button>
                    <button class="class-tab" data-tab="1st">1st</button>
                    <button class="class-tab" data-tab="2nd">2nd</button>
                    <button class="class-tab" data-tab="3rd">3rd</button>
                </div>
            </div>
        </div>

        <!-- Train Cards Container -->
        <div class="train-grid" id="trainGrid">
            <!-- Train cards injected here -->
        </div>

    </main>

    <footer>
        <p>© 2026 Ceylon Track — Sri Lanka Railway Passenger Portal</p>
    </footer>

    <script src="/js/api.js"></script>
    <script>
        let allTrains = [];
        let activeTab = 'all';

        // Set Nav Active Auth Status
        if (window.api.isLoggedIn()) {
            const user = window.api.getUser();
            const authLink = document.getElementById('authLink');
            const authLinkMobile = document.getElementById('authLinkMobile');
            authLink.outerHTML = `<a href="#" onclick="window.api.logout(); return false;">Logout</a>`;
            authLinkMobile.outerHTML = `<a href="#" onclick="window.api.logout(); return false;">Logout</a>`;
            
            if (user && (user.role === 'staff' || user.role === 'admin')) {
                const navLinks = document.getElementById('navLinks');
                const adminNode = document.createElement('a');
                adminNode.href = 'admin.html';
                adminNode.textContent = 'Dashboard 📊';
                navLinks.insertBefore(adminNode, document.getElementById('themeBtn'));
            }
        }

        // Mobile Nav & Theme logic
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const mobileNav = document.getElementById('mobileNav');
        menuToggleBtn.addEventListener('click', () => mobileNav.classList.toggle('open'));

        const themeBtn = document.getElementById('themeBtn');
        const themeBtnMobile = document.getElementById('themeBtnMobile');
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('ceylon_track_theme', newTheme);
        }
        themeBtn.addEventListener('click', toggleTheme);
        themeBtnMobile.addEventListener('click', toggleTheme);

        // Fetch stop details inside accordion
        async function toggleStops(scheduleId, btn) {
            const accordion = document.getElementById(`stops-${scheduleId}`);
            const isOpen = accordion.classList.toggle('open');
            
            if (isOpen) {
                btn.textContent = 'Hide Stops ▴';
                if (accordion.getAttribute('data-loaded') === 'true') return;

                accordion.innerHTML = '<div style="font-size: 0.9rem; color: var(--text-2);">Loading stops...</div>';
                try {
                    const res = await window.api.getRoute(scheduleId);
                    const stops = res.stops || [];
                    if (stops.length === 0) {
                        accordion.innerHTML = '<div style="font-size: 0.9rem; color: var(--text-2);">No stop details available.</div>';
                        return;
                    }

                    accordion.innerHTML = stops.map(s => `
                        <div class="stop-row">
                            <span class="stop-time-label">${s.scheduledTime.slice(0, 5)}</span>
                            <span style="flex: 1; font-weight: 600;">${s.stationName}</span>
                            <span style="color: var(--text-2); font-size: 0.8rem;">Platform ${s.platform || 'N/A'}</span>
                        </div>
                    `).join('');
                    accordion.setAttribute('data-loaded', 'true');
                } catch (e) {
                    accordion.innerHTML = '<div style="font-size: 0.9rem; color: var(--danger);">Failed to load stops.</div>';
                }
            } else {
                btn.textContent = 'View Stops ▾';
            }
        }

        // Add Train to Watch List
        async function watchTrain(scheduleId, btn) {
            if (!window.api.isLoggedIn()) {
                window.api.showToast('Please log in to watch trains', 'error');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = 'Subscribing...';
                await window.api.addWatch(scheduleId);
                window.api.showToast('Train added to watch list!', 'success');
                btn.textContent = 'Watching ✓';
                btn.style.backgroundColor = 'var(--success)';
                btn.style.borderColor = 'var(--success)';
                btn.style.color = '#fff';
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Watch Train';
                window.api.showToast(err.message || 'Subscription failed', 'error');
            }
        }

        // Format times nicely
        function formatTime(t) {
            return t ? t.slice(0, 5) : '';
        }

        // Render card helpers
        function renderTrains() {
            const container = document.getElementById('trainGrid');
            container.innerHTML = '';

            let filtered = allTrains;
            if (activeTab !== 'all') {
                filtered = allTrains.filter(t => {
                    const cls = t.class || '';
                    return cls.toLowerCase() === activeTab.toLowerCase();
                });
            }

            // Sort
            const sortBy = document.getElementById('sortSelect').value;
            if (sortBy === 'departure') {
                filtered.sort((a, b) => {
                    const timeA = a.departureTime || a.departure_time || '';
                    const timeB = b.departureTime || b.departure_time || '';
                    return timeA.localeCompare(timeB);
                });
            } else if (sortBy === 'reliability') {
                filtered.sort((a, b) => {
                    const relA = a.reliabilityPercent !== undefined ? a.reliabilityPercent : a.reliability_percent;
                    const relB = b.reliabilityPercent !== undefined ? b.reliabilityPercent : b.reliability_percent;
                    return (relB || 0) - (relA || 0);
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state card">
                        <div class="empty-train-icon">🚂</div>
                        <h3>No trains found for this route</h3>
                        <p>No schedules match your current filter tabs or search query.</p>
                        <a href="index.html" class="btn btn-secondary">Search Again</a>
                    </div>
                `;
                return;
            }

            filtered.forEach(train => {
                const card = document.createElement('div');
                const liveStatus = train.liveStatus || train.live_status || 'ON_TIME';
                card.className = `card train-card ${liveStatus}`;
                card.id = `train-card-${train.id}`;

                let relBadgeClass = 'badge-neutral';
                let relBadgeEmoji = '⚪';
                const reliability = train.reliability || 'NO_DATA';
                if (reliability === 'USUALLY_ON_TIME') { relBadgeClass = 'badge-success'; relBadgeEmoji = '🟢'; }
                else if (reliability === 'SOMETIMES_DELAYED') { relBadgeClass = 'badge-warning'; relBadgeEmoji = '🟡'; }
                else if (reliability === 'OFTEN_LATE') { relBadgeClass = 'badge-danger'; relBadgeEmoji = '🔴'; }

                let statusBadge = 'badge-success';
                if (liveStatus === 'DELAYED') statusBadge = 'badge-warning';
                if (liveStatus === 'CANCELLED') statusBadge = 'badge-danger';

                const trainNumber = train.trainNumber || train.train_number || '';
                const trainName = train.trainName || train.train_name || '';
                const departureTime = train.departureTime || train.departure_time || '';
                const arrivalTime = train.arrivalTime || train.arrival_time || '';
                const fromStation = train.fromStation || train.from_station || '';
                const toStation = train.toStation || train.to_station || '';
                const delayMinutes = train.delayMinutes !== undefined ? train.delayMinutes : train.delay_minutes;
                const reliabilityPercent = train.reliabilityPercent !== undefined ? train.reliabilityPercent : train.reliability_percent;

                card.innerHTML = `
                    <div class="card-top">
                        <div class="train-title">
                            <span>Train ${trainNumber}</span>
                            <span style="font-size: 0.95rem; font-weight: 500; color: var(--text-2);">${trainName}</span>
                        </div>
                        <span class="badge ${statusBadge}" id="status-badge-${train.id}">${liveStatus.replace('_', ' ')}</span>
                    </div>

                    <div class="card-middle">
                        <div class="time-block">
                            <span class="time-large">${formatTime(departureTime)}</span>
                            <span class="station-sub">${fromStation}</span>
                        </div>
                        <div class="route-path-line"></div>
                        <div class="time-block">
                            <span class="time-large">${formatTime(arrivalTime)}</span>
                            <span class="station-sub">${toStation}</span>
                        </div>
                    </div>

                    ${liveStatus === 'DELAYED' ? `
                        <div class="delay-banner" id="delay-banner-${train.id}">
                            ⚠️ Running ${delayMinutes} minutes late
                        </div>
                    ` : ''}

                    <div class="metadata-row">
                        <span class="badge badge-neutral">${train.class || ''} Class</span>
                        <span class="badge ${relBadgeClass}">
                            ${relBadgeEmoji} Reliability: ${reliabilityPercent !== null && reliabilityPercent !== undefined ? reliabilityPercent + '%' : 'No Data'}
                        </span>
                    </div>

                    <div class="card-actions">
                        <button class="btn btn-secondary" onclick="toggleStops(${train.id}, this)">View Stops ▾</button>
                        <button class="btn btn-primary" id="watch-btn-${train.id}" onclick="watchTrain(${train.id}, this)">Watch Train</button>
                    </div>

                    <div class="stops-accordion" id="stops-${train.id}"></div>
                `;
                container.appendChild(card);
            });
        }

        // Search trigger
        async function executeSearch() {
            const from = document.getElementById('fromInput').value;
            const to = document.getElementById('toInput').value;
            const date = document.getElementById('dateInput').value;
            const trainClass = document.getElementById('classSelect').value;
            const errorBanner = document.getElementById('errorBanner');

            errorBanner.style.display = 'none';
            document.getElementById('resultsCount').textContent = 'Searching schedules...';
            window.api.showSpinner();

            try {
                const res = await window.api.searchSchedules(from, to, date, trainClass);
                console.log('Search result:', res);
                allTrains = res.schedules || [];
                document.getElementById('resultsCount').textContent = `${allTrains.length} train${allTrains.length === 1 ? '' : 's'} found for ${from} → ${to}`;
                renderTrains();
                loadTrackingStatus();
            } catch (err) {
                console.error('Search failed:', err);
                window.api.showToast(err.message || 'Search failed', 'error');
                errorBanner.textContent = err.message || 'Search failed';
                errorBanner.style.display = 'block';
                document.getElementById('resultsCount').textContent = 'Failed to load schedules.';
            } finally {
                window.api.hideSpinner();
            }
        }

        async function loadTrackingStatus() {
            for (const train of allTrains) {
                try {
                    const [gpsRes, lsRes] = await Promise.allSettled([
                        window.api.getTrainLocation(train.id),
                        window.api.getLastStop(train.id)
                    ]);
                    
                    const cardTop = document.querySelector(`#train-card-${train.id} .card-top`);
                    if (!cardTop) continue;

                    // Remove existing tags
                    const existingTags = cardTop.querySelectorAll('.tracking-tag');
                    existingTags.forEach(t => t.remove());

                    let tagHtml = '';
                    if (gpsRes.status === 'fulfilled' && gpsRes.value && !gpsRes.value.error) {
                        tagHtml = `<span class="badge tracking-tag" style="background: rgba(16, 185, 129, 0.15); color: var(--success);">🛰 Live GPS</span>`;
                    } else if (lsRes.status === 'fulfilled' && lsRes.value && !lsRes.value.error) {
                        tagHtml = `<span class="badge tracking-tag" style="background: rgba(245, 158, 11, 0.15); color: var(--warning);">🚉 Last Stop: ${lsRes.value.station_name}</span>`;
                    } else {
                        tagHtml = `<span class="badge tracking-tag badge-neutral">Offline</span>`;
                    }

                    const title = cardTop.querySelector('.train-title');
                    title.insertAdjacentHTML('afterend', tagHtml);
                } catch (e) {
                    console.error("Tracking status error", e);
                }
            }
        }

        // Inline Updates Auto-Refresh
        async function refreshSchedulesInPlace() {
            const from = document.getElementById('fromInput').value;
            const to = document.getElementById('toInput').value;
            const date = document.getElementById('dateInput').value;
            const trainClass = document.getElementById('classSelect').value;

            try {
                const res = await window.api.searchSchedules(from, to, date, trainClass);
                const updatedTrains = res.schedules || [];
                
                updatedTrains.forEach(newTrain => {
                    const existingTrain = allTrains.find(t => t.id === newTrain.id);
                    if (existingTrain) {
                        const newLiveStatus = newTrain.liveStatus || newTrain.live_status || 'ON_TIME';
                        const newDelayMinutes = newTrain.delayMinutes !== undefined ? newTrain.delayMinutes : newTrain.delay_minutes;

                        existingTrain.liveStatus = newLiveStatus;
                        existingTrain.delayMinutes = newDelayMinutes;

                        // Update DOM directly in place if element exists
                        const statusBadge = document.getElementById(`status-badge-${newTrain.id}`);
                        if (statusBadge) {
                            statusBadge.textContent = newLiveStatus.replace('_', ' ');
                            statusBadge.className = 'badge ' + 
                                (newLiveStatus === 'ON_TIME' ? 'badge-success' : 
                                 newLiveStatus === 'DELAYED' ? 'badge-warning' : 'badge-danger');
                        }

                        const card = document.getElementById(`train-card-${newTrain.id}`);
                        if (card) {
                            card.className = `card train-card ${newLiveStatus}`;
                        }

                        const delayBanner = document.getElementById(`delay-banner-${newTrain.id}`);
                        if (newLiveStatus === 'DELAYED') {
                            if (delayBanner) {
                                delayBanner.textContent = `⚠️ Running ${newDelayMinutes} minutes late`;
                            } else {
                                // Re-render card to inject delay banner dynamically
                                renderTrains();
                                loadTrackingStatus();
                            }
                        } else {
                            if (delayBanner) delayBanner.remove();
                        }
                    }
                });
                // Also refresh tracking status for all cards
                loadTrackingStatus();
            } catch (e) {
                console.warn('Silent auto-refresh failed:', e);
            }
        }

        // On Load
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const from = params.get('from') || '';
            const to = params.get('to') || '';
            const date = params.get('date') || '';
            const trainClass = params.get('class') || 'all';

            document.getElementById('fromInput').value = from;
            document.getElementById('toInput').value = to;
            document.getElementById('dateInput').value = date || new Date().toISOString().split('T')[0];
            document.getElementById('classSelect').value = trainClass;

            if (from && to) {
                executeSearch();
            } else {
                document.getElementById('resultsCount').textContent = 'Please specify stations to search.';
            }

            // Tabs Setup
            document.querySelectorAll('.class-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.class-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    activeTab = tab.dataset.tab;
                    renderTrains();
                    loadTrackingStatus();
                });
            });

            // Sort Selector Setup
            document.getElementById('sortSelect').addEventListener('change', renderTrains);

            // Auto-Refresh Setup
            setInterval(refreshSchedulesInPlace, 30000);
        });

        // Compact Search Bar handler
        document.getElementById('compactSearchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Reset class tab filter to All when user executes new search
            document.querySelectorAll('.class-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.class-tab[data-tab="all"]').classList.add('active');
            activeTab = 'all';

            executeSearch();
        });
    </script>
</body>
</html>
