<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Schedules — Ceylon Track</title>
    <link rel="stylesheet" href="/css/theme.css">
    <script src="/js/theme-loader.js"></script>
    <meta name="description" content="View all Sri Lankan Railway train schedules, routes, and timetables on Ceylon Track.">
    <script src="js/ticketing.js"></script>
    <script src="js/api.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-app);
            min-height: 100vh;
        }

        /* ── Header ── */
        .header {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
        .logo-icon {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-inverse); font-size: 1.25rem;
        }
        .logo-text { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.025em; }
        .logo-tagline { font-size: 0.75rem; color: var(--text-secondary); font-weight: 400; text-transform: uppercase; letter-spacing: 0.05em; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-secondary); font-weight: 500; font-size: 0.875rem; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }

        /* ── Page Layout ── */
        .page-content { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

        .page-hero {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 2rem;
        }
        .page-hero h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .page-hero p { font-size: 1rem; color: var(--text-secondary); }

        /* ── Search & Filter Bar ── */
        .controls-card {
            background: var(--bg-surface);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .control-group { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 180px; }
        .control-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
        .control-group input,
        .control-group select {
            padding: 0.65rem 0.9rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-surface);
            transition: border-color 0.2s;
        }
        .control-group input:focus,
        .control-group select:focus { outline: none; border-color: var(--accent); }
        .search-btn {
            padding: 0.68rem 1.5rem;
            background: var(--accent);
            color: var(--text-inverse);
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            align-self: flex-end;
        }
        .search-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,95,42,0.35); }

        /* ── Stats Row ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: var(--bg-surface);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 1rem 1.25rem;
            color: var(--text-primary);
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-card .s-icon { font-size: 1.5rem; margin-bottom: 0.3rem; }
        .stat-card .s-value { font-size: 1.75rem; font-weight: 700; }
        .stat-card .s-label { font-size: 0.72rem; opacity: 0.8; font-weight: 500; margin-top: 0.1rem; }

        /* ── Main Table Card ── */
        .main-card {
            background: var(--bg-surface);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }
        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .card-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); }
        .card-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.15rem; }

        .type-filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .type-btn {
            padding: 0.35rem 0.9rem;
            border: 2px solid var(--border);
            border-radius: 999px;
            background: var(--bg-surface);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .type-btn:hover { border-color: var(--accent); color: var(--accent); }
        .type-btn.active { border-color: var(--accent); background: var(--accent); color: var(--text-inverse); }

        /* ── Table ── */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 0.875rem 1.25rem;
            text-align: left;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: var(--bg-elevated);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        tbody tr { border-bottom: 1px solid var(--border-subtle); transition: background 0.15s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--bg-elevated); cursor: pointer; }
        tbody td { padding: 1rem 1.25rem; font-size: 0.875rem; color: var(--text-primary); vertical-align: middle; }

        .train-cell { display: flex; flex-direction: column; gap: 0.15rem; }
        .train-name { font-weight: 700; color: var(--text-primary); }
        .train-num { font-size: 0.73rem; color: var(--text-muted); }

        .route-cell { display: flex; flex-direction: column; gap: 0.2rem; }
        .route-name { font-weight: 500; }
        .route-stops { font-size: 0.73rem; color: var(--text-muted); }

        .time-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.65rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            background: var(--bg-elevated);
            color: var(--text-primary);
            white-space: nowrap;
        }
        .type-chip {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
        }
        .chip-intercity { background: #ede9fe; color: #6d28d9; }
        .chip-express { background: #dcfce7; color: #166534; }
        .chip-local { background: #fef9c3; color: #854d0e; }
        .chip-mail { background: #fee2e2; color: #991b1b; }

        .days-cell { display: flex; gap: 3px; flex-wrap: wrap; }
        .day-dot {
            width: 24px; height: 24px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .day-on { background: var(--accent); color: var(--text-inverse); }
        .day-off { background: var(--bg-elevated); color: var(--text-muted); }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.4rem 0.85rem;
            background: var(--accent);
            color: var(--text-inverse);
            border: none;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .action-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(26,95,42,0.3); }

        /* ── Loading / Empty / Error ── */
        .state-container { display: flex; justify-content: center; align-items: center; padding: 4rem 2rem; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        .empty-state .e-icon { font-size: 3rem; margin-bottom: 0.75rem; }
        .empty-state p { font-size: 0.95rem; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .page-hero h1 { font-size: 1.5rem; }
            .controls-card { flex-direction: column; }
            .days-cell { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="navbar-content">
                <a href="index.html" class="navbar-brand">
                    <span>🚂</span> Ceylon Track
                </a>
                <ul class="nav-links" id="nav-links">
                    <!-- Nav populated by api.js -->
                </ul>
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
            </div>
        </nav>
    </header>

    <main class="page-content">
        <div class="page-hero">
            <h1>🗓️ Train Schedules</h1>
            <p>Full timetable of all Sri Lankan Railway services</p>
        </div>

        <!-- Search / Filter Controls -->
        <div class="controls-card">
            <div class="control-group">
                <label>Search by Train Name</label>
                <input type="text" id="searchInput" placeholder="e.g. Udarata Menike...">
            </div>
            <div class="control-group">
                <label>Filter by Type</label>
                <select id="typeSelect">
                    <option value="all">All Types</option>
                    <option value="Intercity">Intercity</option>
                    <option value="Express">Express</option>
                    <option value="Local">Local</option>
                    <option value="Diesel">Diesel</option>
                </select>
            </div>
            <div class="control-group">
                <label>Travel Date</label>
                <input type="date" id="dateInput">
            </div>
            <button class="search-btn" onclick="applyFilters()">🔍 Filter</button>
        </div>

        <!-- Summary Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="s-icon">🚂</div>
                <div class="s-value" id="statTotal">—</div>
                <div class="s-label">Total Schedules</div>
            </div>
            <div class="stat-card">
                <div class="s-icon">🚄</div>
                <div class="s-value" id="statIntercity">—</div>
                <div class="s-label">Intercity</div>
            </div>
            <div class="stat-card">
                <div class="s-icon">🚃</div>
                <div class="s-value" id="statExpress">—</div>
                <div class="s-label">Express</div>
            </div>
            <div class="stat-card">
                <div class="s-icon">🛤️</div>
                <div class="s-value" id="statRoutes">—</div>
                <div class="s-label">Routes Covered</div>
            </div>
        </div>

        <!-- Main Table -->
        <div class="main-card">
            <div class="card-header">
                <div>
                    <div class="card-title">📋 All Train Schedules</div>
                    <div class="card-sub" id="cardSub">Loading schedules from the database...</div>
                </div>
                <div class="type-filters">
                    <button class="type-btn active" onclick="setTypeFilter('all', this)">All</button>
                    <button class="type-btn" onclick="setTypeFilter('Intercity', this)">Intercity</button>
                    <button class="type-btn" onclick="setTypeFilter('Express', this)">Express</button>
                    <button class="type-btn" onclick="setTypeFilter('Local', this)">Local</button>
                </div>
            </div>

            <div id="tableArea">
                <div class="state-container"><div class="spinner"></div></div>
            </div>
        </div>
    </main>

    <script>
        const DAY_LABELS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
        let allSchedules = [];
        let currentTypeFilter = 'all';

        document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

        async function loadAllSchedules() {
            try {
                const data = await window.api._fetch('/api/schedules/all');
                allSchedules = data.schedules || data || [];
            } catch (e) {
                try {
                    const data = await window.api._fetch('/api/staff/trains');
                    allSchedules = (data.trains || data || []).map(t => ({
                        schedule_id: t.id,
                        train_name: t.name,
                        train_number: t.number,
                        train_type: t.type,
                        route_name: 'See Search Page',
                        route_type: t.type,
                        from_station: '—',
                        to_station: '—',
                        departure_time: '—',
                        arrival_time: '—',
                        days: [0,1,2,3,4,5,6],
                        active: t.active
                    }));
                } catch (e2) {
                    showError('Could not connect to the backend. Make sure the server is running.');
                    return;
                }
            }
            updateStats();
            renderTable();
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = allSchedules.length;
            document.getElementById('statIntercity').textContent =
                allSchedules.filter(s => (s.train_type || s.route_type || '').toLowerCase().includes('intercity')).length;
            document.getElementById('statExpress').textContent =
                allSchedules.filter(s => (s.train_type || s.route_type || '').toLowerCase().includes('express')).length;
            const routes = new Set(allSchedules.map(s => s.route_name).filter(Boolean));
            document.getElementById('statRoutes').textContent = routes.size || '—';
        }

        function setTypeFilter(type, btn) {
            currentTypeFilter = type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
        }

        function applyFilters() { renderTable(); }

        function renderTable() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const typeVal = document.getElementById('typeSelect').value;

            let filtered = allSchedules.filter(s => {
                const name = (s.train_name || '').toLowerCase();
                const type = (s.train_type || s.route_type || '');
                const matchSearch = !searchVal || name.includes(searchVal);
                const matchType = (currentTypeFilter === 'all' && typeVal === 'all') ||
                    (currentTypeFilter !== 'all' && type.includes(currentTypeFilter)) ||
                    (typeVal !== 'all' && type.includes(typeVal));
                return matchSearch && matchType;
            });

            document.getElementById('cardSub').textContent =
                `Showing ${filtered.length} of ${allSchedules.length} schedules`;

            if (filtered.length === 0) {
                document.getElementById('tableArea').innerHTML = `
                    <div class="empty-state">
                        <div class="e-icon">🔎</div>
                        <p>No schedules match your search. Try a different name or type.</p>
                    </div>`;
                return;
            }

            const typeChip = type => {
                const t = (type || '').toLowerCase();
                if (t.includes('intercity')) return `<span class="type-chip chip-intercity">${type}</span>`;
                if (t.includes('express')) return `<span class="type-chip chip-express">${type}</span>`;
                if (t.includes('local')) return `<span class="type-chip chip-local">${type}</span>`;
                return `<span class="type-chip chip-mail">${type || 'N/A'}</span>`;
            };

            const daysHtml = (days) => {
                if (!days || days.length === 0) return DAY_LABELS.map((d, i) =>
                    `<span class="day-dot day-on" title="${d}">${d}</span>`).join('');
                return DAY_LABELS.map((d, i) =>
                    `<span class="day-dot ${days.includes(i) ? 'day-on' : 'day-off'}" title="${d}">${d}</span>`
                ).join('');
            };

            const rows = filtered.map(s => `
                <tr onclick="goToSearch('${s.train_name || ''}')">
                    <td>
                        <div class="train-cell">
                            <span class="train-name">${s.train_name || '—'}</span>
                            <span class="train-num">#${s.train_number || s.schedule_id}</span>
                        </div>
                    </td>
                    <td>${typeChip(s.train_type || s.route_type)}</td>
                    <td>
                        <div class="route-cell">
                            <span class="route-name">${s.route_name || '—'}</span>
                            ${s.from_station && s.from_station !== '—'
                                ? `<span class="route-stops">${s.from_station} → ${s.to_station}</span>`
                                : ''}
                        </div>
                    </td>
                    <td>
                        ${s.departure_time && s.departure_time !== '—'
                            ? `<span class="time-badge">🕐 ${s.departure_time}</span>`
                            : '<span style="color:var(--text-muted)">—</span>'}
                    </td>
                    <td>
                        ${s.arrival_time && s.arrival_time !== '—'
                            ? `<span class="time-badge">🏁 ${s.arrival_time}</span>`
                            : '<span style="color:var(--text-muted)">—</span>'}
                    </td>
                    <td><div class="days-cell">${daysHtml(s.days)}</div></td>
                    <td>
                        <a class="action-btn" href="index.html" onclick="prefillSearch('${s.from_station}', '${s.to_station}')">
                            🔍 Search Route
                        </a>
                    </td>
                </tr>
            `).join('');

            document.getElementById('tableArea').innerHTML = `
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Train</th>
                                <th>Type</th>
                                <th>Route</th>
                                <th>Departs</th>
                                <th>Arrives</th>
                                <th>Runs On</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        function showError(msg) {
            document.getElementById('tableArea').innerHTML = `
                <div class="empty-state">
                    <div class="e-icon">⚠️</div>
                    <p><strong>Could not load schedules</strong></p>
                    <p style="font-size:0.8rem;margin-top:0.5rem;color:#94a3b8">${msg}</p>
                </div>`;
            document.getElementById('cardSub').textContent = 'Failed to load data.';
        }

        function goToSearch(trainName) {
            // User clicked a row — navigate to search page
            window.location.href = `index.html`;
        }

        function prefillSearch(from, to) {
            // Store in sessionStorage so index.html can pick it up
            if (from && from !== '—') sessionStorage.setItem('prefill_from', from);
            if (to && to !== '—') sessionStorage.setItem('prefill_to', to);
        }

        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') applyFilters();
        });

        // ── Kick off ──
        window.api.updateNav();
        loadAllSchedules();
    </script>
</body>
</html>
