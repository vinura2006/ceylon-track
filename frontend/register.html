<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Ceylon Track</title>
    <link rel="stylesheet" href="/css/theme.css">
    <script src="/js/theme-loader.js"></script>
    

    <style>
        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        /* Page Layout */
        .auth-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            background-color: var(--bg-elevated);
            padding: 0.25rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
        }

        .auth-tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            border: none;
            background: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-tab.active {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        .staff-fields {
            display: none;
            background-color: rgba(15, 76, 117, 0.05);
            border-left: 4px solid var(--accent);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .name-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="navbar-brand">
                <i class="fa-solid fa-train"></i> Ceylon Track
            </a>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">☰</button>
            <ul class="navbar-links" id="nav-links">
                <!-- Nav populated dynamically by api.js -->
            </ul>
        </div>
    </nav>

    <main class="auth-page">
        
        <div class="card auth-card">
            <div style="text-align: center;">
                <h2 style="font-size: 2rem; margin-bottom: 0.25rem;">Create Account</h2>
                <p style="color: var(--text-2); font-weight: 600;">Join Ceylon Track today</p>
            </div>

            <form class="auth-form" id="registerForm">
                <div class="auth-tabs">
                    <button type="button" class="auth-tab active" data-role="passenger">🚆 Passenger</button>
                    <button type="button" class="auth-tab" data-role="staff">👷 Staff</button>
                </div>

                <div class="name-row">
                    <div class="input-group">
                        <label for="firstNameInput">First Name</label>
                        <input type="text" id="firstNameInput" class="input-field" placeholder="e.g. Ruwan" required>
                    </div>
                    <div class="input-group">
                        <label for="lastNameInput">Last Name</label>
                        <input type="text" id="lastNameInput" class="input-field" placeholder="e.g. Perera" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="emailInput">Email Address</label>
                    <input type="email" id="emailInput" class="input-field" placeholder="e.g. ruwan@ceylon.lk" required>
                </div>

                <div class="staff-fields" id="staffFields" style="display: none;">
                    <div class="input-group">
                        <label for="employeeIdInput">Employee ID</label>
                        <input type="text" id="employeeIdInput" class="input-field" placeholder="e.g. EMP-001">
                    </div>
                    <div class="input-group">
                        <label for="accessCodeInput">Staff Access Code</label>
                        <input type="password" id="accessCodeInput" class="input-field" placeholder="Secret code from HR">
                    </div>
                    <div class="input-group" id="subRoleGroup">
                        <label for="subRoleInput">Staff Role</label>
                        <select id="subRoleInput" class="input-field">
                            <option value="staff">Driver / Guard / On-board Staff</option>
                            <option value="station_master">Station Master</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" class="input-field" placeholder="At least 6 characters" required>
                </div>
                <div class="input-group">
                    <label for="confirmPasswordInput">Confirm Password</label>
                    <input type="password" id="confirmPasswordInput" class="input-field" placeholder="••••••••" required>
                </div>
                <div id="errorMsg" style="color: var(--danger); font-weight: 700; text-align: center; display: none; margin-top: 0.5rem;"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Sign Up
                </button>
            </form>

            <div style="text-align: center; font-size: 0.95rem; color: var(--text-2); font-weight: 600;">
                Already have an account? <a href="login.html">Sign in here</a>
            </div>
        </div>

    </main>

    <footer>
        <p>© 2026 Ceylon Track — Sri Lanka Railway Passenger Portal</p>
    </footer>

    <script src="/js/api.js"></script>
    <script>
        // Dynamically load nav links
        window.api.updateNav();

        // Redirect if already logged in
        if (window.api.isLoggedIn()) {
            const user = window.api.getUser();
            if (window.api.needsStationSetup()) {
                window.location.href = 'station-setup.html';
            } else if (user.role === 'admin' || user.role === 'ceylon-track-admin') {
                window.location.href = 'admin.html';
            } else if (user.role === 'staff') {
                window.location.href = 'staff-app.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        let activeRole = 'passenger';

        // Tab Switching Logic
        const tabs = document.querySelectorAll('.auth-tab');
        const staffFields = document.getElementById('staffFields');
        const empIdInput = document.getElementById('employeeIdInput');
        const accessCodeInput = document.getElementById('accessCodeInput');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                activeRole = tab.getAttribute('data-role');

                if (activeRole === 'staff') {
                    staffFields.style.display = 'flex';
                    empIdInput.required = true;
                    accessCodeInput.required = true;
                } else {
                    staffFields.style.display = 'none';
                    empIdInput.required = false;
                    accessCodeInput.required = false;
                }
            });
        });

        // Register Handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const firstName = document.getElementById('firstNameInput').value.trim();
            const lastName = document.getElementById('lastNameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;
            const empId = empIdInput.value.trim();
            const accessCode = accessCodeInput.value.trim();
            const subRole = document.getElementById('subRoleInput').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            if (!firstName || !lastName || !email) {
                errorMsg.textContent = 'Please fill all required fields';
                errorMsg.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errorMsg.textContent = 'Password must be at least 6 characters';
                errorMsg.style.display = 'block';
                window.api.showToast('Password must be at least 6 characters', 'error');
                return;
            }
            if (password !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match';
                errorMsg.style.display = 'block';
                window.api.showToast('Passwords do not match', 'error');
                return;
            }
            if (activeRole === 'staff' && (!empId || !accessCode)) {
                errorMsg.textContent = 'Employee ID and Access Code are required for staff';
                errorMsg.style.display = 'block';
                return;
            }

            window.api.showSpinner();
            try {
                const res = await window.api.register(firstName, lastName, email, password, activeRole, empId, accessCode, subRole);

                if (res.status === 'pending') {
                    errorMsg.style.display = 'block';
                    errorMsg.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
                    errorMsg.style.color = 'var(--success)';
                    errorMsg.style.border = '1px solid var(--success)';
                    errorMsg.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' + (res.message || 'Your registration is pending admin approval.');
                    window.api.showToast('Registration submitted!', 'success');
                    setTimeout(function() { window.location.href = '/login.html'; }, 4000);
                    return;
                }

                window.api.setAuth(res.token, res.user, res.refreshToken);
                window.api.showToast('Account created successfully! Welcome, ' + res.user.firstName + '!', 'success');
                
                setTimeout(() => {
                    const user = window.api.getUser();
                    if (window.api.needsStationSetup()) {
                        window.location.href = '/station-setup.html';
                    } else if (user.role === 'admin' || user.role === 'ceylon-track-admin') {
                        window.location.href = '/admin.html';
                    } else if (user.role === 'staff') {
                        window.location.href = '/staff-app.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                }, 1500);
            } catch (err) {
                console.error('Registration failed:', err);
                window.api.showToast(err.message || 'Registration failed', 'error');
                errorMsg.textContent = err.message || 'Registration failed';
                errorMsg.style.display = 'block';
            } finally {
                window.api.hideSpinner();
            }
        });
    </script>
</body>
</html>
