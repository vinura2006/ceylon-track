<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Ceylon Track</title>
    <link rel="stylesheet" href="/css/theme.css">
    <script src="/js/theme-loader.js"></script>
    

    <style>
        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        /* Page Layout */
        .auth-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            background-color: var(--bg-elevated);
            padding: 0.25rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
        }

        .auth-tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            border: none;
            background: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-tab.active {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="navbar-brand">
                <i class="fa-solid fa-train"></i> Ceylon Track
            </a>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">☰</button>
            <ul class="navbar-links" id="nav-links">
                <!-- Nav populated dynamically by api.js -->
            </ul>
        </div>
    </nav>

    <main class="auth-page">
        
        <div class="card auth-card">
            <div style="text-align: center;">
                <h2 style="font-size: 2rem; margin-bottom: 0.25rem;">Welcome Back</h2>
                <p style="color: var(--text-2); font-weight: 600;">Sign in to your Ceylon Track account</p>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="auth-tabs">
                    <button type="button" class="auth-tab active" data-role="passenger">🚆 Passenger</button>
                    <button type="button" class="auth-tab" data-role="staff">👷 Staff</button>
                    <button type="button" class="auth-tab" data-role="admin">🛡️ Admin</button>
                </div>

                <div class="input-group">
                    <label id="identifierLabel" for="identifierInput">Email Address</label>
                    <input type="text" id="identifierInput" class="input-field" placeholder="e.g. passenger@ceylon.lk" required>
                </div>
                <div class="input-group">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" class="input-field" placeholder="••••••••" required>
                </div>
                <div id="errorMsg" style="color: var(--danger); font-weight: 700; text-align: center; display: none; margin-top: 0.5rem;"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Sign In
                </button>
            </form>

            <div style="text-align: center; font-size: 0.95rem; color: var(--text-2); font-weight: 600;">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>

    </main>

    <footer>
        <p>© 2026 Ceylon Track — Sri Lanka Railway Passenger Portal</p>
    </footer>

    <script src="/js/api.js"></script>
    <script>
        // Dynamically load nav links
        window.api.updateNav();

        // Redirect if already logged in
        if (window.api.isLoggedIn()) {
            const user = window.api.getUser();
            if (window.api.needsStationSetup()) {
                window.location.href = 'station-setup.html';
            } else if (user.role === 'admin' || user.role === 'ceylon-track-admin') {
                window.location.href = 'admin.html';
            } else if (user.role === 'staff') {
                window.location.href = 'staff-app.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        let activeRole = 'passenger';

        // Tab Switching Logic
        const tabs = document.querySelectorAll('.auth-tab');
        const identifierLabel = document.getElementById('identifierLabel');
        const identifierInput = document.getElementById('identifierInput');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                activeRole = tab.getAttribute('data-role');

                if (activeRole === 'staff') {
                    identifierLabel.textContent = 'Email or Employee ID';
                    identifierInput.type = 'text';
                    identifierInput.placeholder = 'e.g. staff@ceylon.lk or EMP-001';
                } else if (activeRole === 'admin') {
                    identifierLabel.textContent = 'Email Address';
                    identifierInput.type = 'email';
                    identifierInput.placeholder = 'e.g. admin@ceylon.lk';
                } else {
                    identifierLabel.textContent = 'Email Address';
                    identifierInput.type = 'email';
                    identifierInput.placeholder = 'e.g. passenger@ceylon.lk';
                }
            });
        });

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('identifierInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';
            window.api.showSpinner();
            try {
                const res = await window.api.login(activeRole, identifier, password);
                window.api.setAuth(res.token, res.user, res.refreshToken);
                window.api.showToast(`Welcome back, ${res.user.firstName}!`, 'success');
                
                setTimeout(() => {
                    const user = window.api.getUser();
                    if (window.api.needsStationSetup()) {
                        window.location.href = '/station-setup.html';
                    } else if (user.role === 'admin' || user.role === 'ceylon-track-admin') {
                        window.location.href = '/admin.html';
                    } else if (user.role === 'staff') {
                        window.location.href = '/staff-app.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                }, 1500);
            } catch (err) {
                console.error('Login failed:', err);
                window.api.showToast(err.message || 'Login failed', 'error');
                errorMsg.textContent = err.message || 'Login failed';
                errorMsg.style.display = 'block';
            } finally {
                window.api.hideSpinner();
            }
        });
    </script>
</body>
</html>
