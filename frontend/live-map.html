<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live GPS Train Map — Ceylon Track</title>
    <link rel="stylesheet" href="/css/theme.css">
    <script src="/js/theme-loader.js"></script>
    
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* ============================================================
           CEYLON TRACK GLOBAL DESIGN SYSTEM
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Full Screen Map container */
        .map-wrapper {
            position: relative;
            flex: 1;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #map {
            width: 100%;
            height: 100%;
        }

        /* Control Panel Overlay */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 700px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            padding: 1.25rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: all 0.3s;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .nav-link-btn {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-hover);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            background: var(--bg-elevated);
        }
        .nav-link-btn:hover {
            background: var(--border);
        }

        /* Search Actions */
        .controls-row {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 0.5rem;
            align-items: center;
        }



        /* Status & Signal countdown overlays */
        .status-overlay {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .signal-loss-warning {
            background-color: rgba(217, 119, 6, 0.15);
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .info-message-overlay {
            background-color: rgba(15, 76, 117, 0.1);
            border: 1px solid var(--accent);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            display: none;
            text-align: center;
            margin-top: 0.25rem;
        }

        /* Animated live train marker icon */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.65; }
            100% { transform: scale(1); opacity: 1; }
        }
        .train-marker {
            font-size: 24px;
            text-align: center;
            line-height: 1;
        }
        .train-marker .train-label {
            font-size: 11px;
            font-weight: 700;
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 1px 6px;
            border-radius: 4px;
            white-space: nowrap;
            margin-top: 2px;
        }
        .train-marker.live .train-icon {
            color: var(--danger);
            animation: pulse 2s infinite;
        }
        .train-marker.stale .train-icon {
            color: var(--warning);
            opacity: 0.6;
        }
        .train-marker.offline .train-icon {
            color: #6b7280;
            opacity: 0.4;
        }
        .tracking-indicator {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--bg-surface);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 10px 16px;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-primary);
            z-index: 1001;
            display: none;
            box-shadow: var(--shadow-sm);
        }
        .tracking-indicator button {
            margin-left: 12px;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 700;
        }

        /* Back to Home Button Float */
        .theme-btn-float {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            font-size: 1.25rem;
            z-index: 1000;
        }

        /* Responsive overrides */
        @media (max-width: 600px) {
            .control-panel {
                top: 10px;
                width: calc(100% - 20px);
                padding: 0.85rem;
            }
            .controls-row {
                grid-template-columns: 1fr;
            }
            .panel-title {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <!-- Full Screen Leaflet Map Container -->
    <div class="map-wrapper">
        <div id="map"></div>

        <!-- Single-train tracking indicator -->
        <div class="tracking-indicator" id="trackingIndicator">
            <span id="trackingLabel">Tracking: --</span>
            <button id="stopTrackingBtn" class="btn btn-danger btn-sm">✕ Stop Tracking</button>
        </div>

        <!-- Float controls Panel overlaid on map -->
        <div class="control-panel">
            <div class="panel-header">
                <span class="panel-title"><span>🛰</span> Ceylon Track — Live Map</span>
                <a id="backLink" href="/index.html" class="nav-link-btn" style="display: none;">← Back Search</a>
            </div>

            <div class="controls-row">
                <select id="scheduleSelect" class="input-field">
                    <option value="">Loading active trains...</option>
                </select>
                <button class="btn btn-primary" id="trackBtn">Track This Train</button>
            </div>

            <div class="controls-row" style="margin-top: 0.25rem;">
                <input type="text" id="searchInput" class="input-field" placeholder="Search train name or number..." oninput="filterTrains()">
            </div>

            <div class="status-overlay">
                <span id="liveStatusText">Select a train to begin tracking</span>
                <span id="countdownDisplay">Last updated: --</span>
            </div>

            <!-- Warning Banner overlays -->
            <div class="signal-loss-warning" id="signalWarning"></div>
            <div class="info-message-overlay" id="infoOverlay"></div>
        </div>
    </div>



    <script src="/js/api.js"></script>
    <script>
        var stationCoords = {};

        // Map Setup
        var map = L.map('map').setView([7.8731, 80.7718], 8);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        async function loadStations() {
            try {
                var stations = await api.getStations();
                var list = Array.isArray(stations) ? stations : (stations.stations || []);
                list.forEach(function(s) {
                    var lat = parseFloat(s.lat || s.latitude);
                    var lng = parseFloat(s.lng || s.longitude);
                    if (!isNaN(lat) && !isNaN(lng)) {
                        stationCoords[s.code] = { lat: lat, lng: lng };
                        L.circleMarker([lat, lng], {
                            radius: 6,
                            color: '#0077B6',
                            fillColor: '#00B4D8',
                            fillOpacity: 0.8,
                            weight: 2
                        }).addTo(map).bindPopup('<b>' + s.name + ' (' + s.code + ')</b>');
                    }
                });
            } catch(e) {
                console.error('Failed to load stations for map:', e);
            }
        }
        loadStations();

        // Railway Lines GeoJSON loading and snapping
        var railwayGeoJSON = null;
        var railPoints = [];

        function extractRailPoints(geojson) {
            var points = [];
            if (!geojson || !geojson.features) return points;
            geojson.features.forEach(function(feature) {
                if (feature.geometry) {
                    var type = feature.geometry.type;
                    var coords = feature.geometry.coordinates;
                    if (type === 'LineString') {
                        coords.forEach(function(c) {
                            points.push([c[1], c[0]]); // GeoJSON is [lng, lat] -> we need [lat, lng]
                        });
                    } else if (type === 'MultiLineString') {
                        coords.forEach(function(line) {
                            line.forEach(function(c) {
                                points.push([c[1], c[0]]);
                            });
                        });
                    }
                }
            });
            // Downsample if too large to make snapping super fast: keep every 2nd or 3rd point
            var downsampled = [];
            var skip = Math.max(1, Math.floor(points.length / 5000));
            for (var i = 0; i < points.length; i += skip) {
                downsampled.push(points[i]);
            }
            return downsampled;
        }

        function snapToRail(lat, lng) {
            if (!railPoints || railPoints.length === 0) return [lat, lng];
            var minDistSq = Infinity;
            var nearest = [lat, lng];
            
            for (var i = 0; i < railPoints.length; i++) {
                var p = railPoints[i];
                var dSq = (lat - p[0]) * (lat - p[0]) + (lng - p[1]) * (lng - p[1]);
                if (dSq < minDistSq) {
                    minDistSq = dSq;
                    nearest = p;
                }
            }
            
            // 0.005 degrees is roughly 500 meters
            if (minDistSq < 0.000025) {
                return nearest;
            }
            return [lat, lng];
        }

        async function loadRailwayLines() {
            try {
                var response = await fetch('/js/srilanka_railway.geojson');
                if (!response.ok) throw new Error('Failed to load railway lines');
                railwayGeoJSON = await response.json();
                railPoints = extractRailPoints(railwayGeoJSON);

                L.geoJSON(railwayGeoJSON, {
                    style: { color: '#475569', weight: 4, opacity: 0.65 }
                }).addTo(map);

                L.geoJSON(railwayGeoJSON, {
                    style: { color: '#f8fafc', weight: 1.5, dashArray: '5, 5', opacity: 0.9 }
                }).addTo(map);
            } catch (err) {
                console.error('Error loading railway lines:', err);
            }
        }



        // Tracking state
        var pollInterval = null;
        var selectedScheduleId = null;
        var trackingTrain = null;
        var trainMarkers = {};
        var activeTrains = [];
        var updateTimer = null;
        var ws = null;
        var wsReconnectTimer = null;

        function markerIcon(train, isSelected) {
            var cls = 'live';
            var diff = train.updated_at ? Math.floor((Date.now() - new Date(train.updated_at).getTime()) / 1000) : 999;
            if (diff > 120) {
                cls = 'stale';
            }
            if (diff > 900) {
                cls = 'offline';
            }
            
            var borderColor = isSelected ? '#00F3FF' : (cls === 'live' ? '#00FF66' : (cls === 'stale' ? '#FFD600' : '#475569'));
            var size = isSelected ? 48 : 36;
            var fontSize = isSelected ? 32 : 24;

            return L.divIcon({
                html: '<div class="train-marker ' + cls + '" style="border: 2px solid ' + borderColor + '; border-radius: 50%; width:' + size + 'px; height:' + size + 'px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.65);">'
                    + '<span class="train-icon" style="font-size:' + fontSize + 'px;">🚂</span>'
                    + '<span class="train-label">' + (train.train_number || '') + '</span>'
                    + '</div>',
                className: '',
                iconSize: [size, size],
                iconAnchor: [size/2, size]
            });
        }

        function fetchAllActiveTrains() {
            return api._fetch('/api/sessions/active').then(function(sVal) {
                var sessions = Array.isArray(sVal) ? sVal : (sVal.sessions || []);
                var merged = {};
                
                sessions.forEach(function(s) {
                    var id = String(s.schedule_id);
                    merged[id] = {
                        schedule_id: Number(id),
                        train_name: s.train_name || s.trainName || 'Train',
                        train_number: s.train_number || s.trainNumber || '',
                        lat: s.lat || s.latitude,
                        lng: s.lng || s.longitude,
                        speed: s.speed || s.last_speed || 0,
                        updated_at: s.updated_at || s.session_start || new Date().toISOString(),
                        from_station: s.from_station || s.fromStation || '',
                        to_station: s.to_station || s.toStation || '',
                        is_fallback: false
                    };
                });
                
                activeTrains = Object.values(merged);
                updateAllMarkers();
                if (trackingTrain) {
                    followTrackedTrain();
                }
            }).catch(function(e) {
                console.error('Fetch active trains error:', e);
            });
        }

        function updateAllMarkers() {
            var activeIds = {};
            activeTrains.forEach(function(t) {
                var id = String(t.schedule_id);
                activeIds[id] = t;
                var latlng = snapToRail(parseFloat(t.lat), parseFloat(t.lng));
                var isSelected = selectedScheduleId === id;

                if (trainMarkers[id]) {
                    if (isSelected !== trainMarkers[id].isSelected) {
                        trainMarkers[id].marker.setIcon(markerIcon(t, isSelected));
                        trainMarkers[id].isSelected = isSelected;
                    }
                    trainMarkers[id].marker.setLatLng(latlng);
                    trainMarkers[id].train = t;
                } else {
                    var marker = L.marker(latlng, { icon: markerIcon(t, isSelected) }).addTo(map);
                    trainMarkers[id] = {
                        marker: marker,
                        train: t,
                        isSelected: isSelected
                    };

                    marker.on('click', function() {
                        startTrackingTrain(id);
                    });
                }

                var diff = t.updated_at ? Math.floor((Date.now() - new Date(t.updated_at).getTime()) / 1000) : 999;
                var isLive = (diff < 120);
                var statusHtml = isLive 
                    ? '<span style="color:var(--success)">● Live GPS</span>' 
                    : '<span style="color:var(--warning)">Signal lost — ' + Math.floor(diff/60) + ' min ago</span>';
                
                var popupHtml = '<strong>' + (t.train_name || 'Train') + '</strong> (#' + (t.train_number || '') + ')<br>'
                    + (t.from_station || '') + ' → ' + (t.to_station || '') + '<br>'
                    + statusHtml
                    + '<br><small>Updated: ' + (t.updated_at ? new Date(t.updated_at).toLocaleTimeString() : '—') + '</small>'
                    + '<br><button onclick="startTrackingTrain(\'' + id + '\')" style="margin-top:4px; padding:4px 10px; border-radius:4px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; font-weight:700;">📍 Track This Train</button>';
                trainMarkers[id].marker.bindPopup(popupHtml);
            });

            Object.keys(trainMarkers).forEach(function(id) {
                if (!activeIds[id]) {
                    map.removeLayer(trainMarkers[id].marker);
                    delete trainMarkers[id];
                }
            });
        }

        function startTrackingTrain(trainId) {
            selectedScheduleId = trainId;
            var train = activeTrains.find(function(t) { return String(t.schedule_id) === trainId; }) || (trainMarkers[trainId] && trainMarkers[trainId].train);
            if (!train) return;

            trackingTrain = { id: trainId, name: train.train_name || 'Train ' + trainId, number: train.train_number || '' };

            var latlng = snapToRail(parseFloat(train.lat), parseFloat(train.lng));
            map.setView(latlng, 14);

            document.getElementById('trackingLabel').textContent = 'Tracking: ' + trackingTrain.name + ' (#' + trackingTrain.number + ')';
            document.getElementById('trackingIndicator').style.display = 'flex';
            document.getElementById('liveStatusText').textContent = 'Following train #' + trainId + ' — all trains visible';

            updateAllMarkers();
        }
        window.startTrackingTrain = startTrackingTrain;

        function stopTracking() {
            selectedScheduleId = null;
            trackingTrain = null;
            document.getElementById('trackingIndicator').style.display = 'none';
            document.getElementById('liveStatusText').textContent = 'Select a train to begin tracking';
            map.setView([7.8731, 80.7718], 8);
            updateAllMarkers();
        }

        function followTrackedTrain() {
            if (!trackingTrain) return;
            var t = activeTrains.find(function(t) { return String(t.schedule_id) === trackingTrain.id; });
            if (t) {
                var latlng = snapToRail(parseFloat(t.lat), parseFloat(t.lng));
                map.setView(latlng, 14, { animate: true, duration: 0.5 });
            }
        }

        document.getElementById('stopTrackingBtn').addEventListener('click', stopTracking);

        function filterTrains() {
            var query = (document.getElementById('searchInput').value || '').toLowerCase();
            Object.keys(trainMarkers).forEach(function(id) {
                var t = trainMarkers[id].train;
                var name = (t.train_name || '').toLowerCase();
                var num = String(t.train_number || '').toLowerCase();
                var match = !query || name.indexOf(query) >= 0 || num.indexOf(query) >= 0;
                if (match) {
                    if (!map.hasLayer(trainMarkers[id].marker)) trainMarkers[id].marker.addTo(map);
                } else {
                    if (map.hasLayer(trainMarkers[id].marker)) map.removeLayer(trainMarkers[id].marker);
                }
            });
        }

        function loadActiveSchedules() {
            var sel = document.getElementById('scheduleSelect');
            var infoOverlay = document.getElementById('infoOverlay');
            sel.innerHTML = '<option value="">Select a Train to Track...</option>';
            activeTrains.forEach(function(t) {
                var opt = document.createElement('option');
                opt.value = t.schedule_id;
                opt.textContent = (t.train_name || 'Train') + ' (#' + (t.train_number || '') + ')';
                sel.appendChild(opt);
            });

            if (activeTrains.length === 0) {
                infoOverlay.textContent = 'Currently there are no trains sharing the live locations.';
                infoOverlay.style.display = 'block';
                document.getElementById('liveStatusText').textContent = 'No active broadcasts';
            } else {
                infoOverlay.style.display = 'none';
                if (!selectedScheduleId) {
                    document.getElementById('liveStatusText').textContent = 'Select a train to begin tracking';
                }
            }
        }

        function trackTrainFromSelect() {
            var val = document.getElementById('scheduleSelect').value;
            if (!val) return;
            startTrackingTrain(val);
        }

        function startLiveTimer() {
            if (updateTimer) clearInterval(updateTimer);
            updateTimer = setInterval(function() {
                document.getElementById('countdownDisplay').textContent = 'Active trains: ' + activeTrains.length;
            }, 3000);
        }

        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            var wsUrl = protocol + '//' + window.location.host + '/ws';

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = function() {
                    console.log('WebSocket connected');

                    var token = api.getToken();
                    if (token) {
                        ws.send(JSON.stringify({ type: 'auth', token: token }));
                    }
                };

                ws.onmessage = function(event) {
                    try {
                        var msg = JSON.parse(event.data);
                        if (msg.type === 'auth_ok') {
                            console.log('WebSocket authenticated');
                        } else if (msg.type === 'train_update') {
                            handleWsTrainUpdate(msg);
                        } else if (msg.type === 'train_offline') {
                            handleWsTrainOffline(msg);
                        }
                    } catch(e) {}
                };

                ws.onclose = function() {
                    console.log('WebSocket disconnected');
                    ws = null;
                    if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
                    wsReconnectTimer = setTimeout(connectWebSocket, 5000);
                };

                ws.onerror = function() {
                    if (ws) ws.close();
                };
            } catch(e) {
                console.log('WebSocket connection failed, using polling');
            }
        }

        function handleWsTrainUpdate(msg) {
            var trainId = String(msg.trainId);
            var updated = false;
            for (var i = 0; i < activeTrains.length; i++) {
                if (String(activeTrains[i].schedule_id) === trainId) {
                    activeTrains[i].lat = msg.latitude;
                    activeTrains[i].lng = msg.longitude;
                    activeTrains[i].accuracy = msg.accuracy;
                    activeTrains[i].speed = msg.speed;
                    activeTrains[i].heading = msg.heading;
                    activeTrains[i].updated_at = msg.timestamp || new Date().toISOString();
                    updated = true;
                    break;
                }
            }
            if (!updated) {
                activeTrains.push({
                    schedule_id: msg.trainId,
                    train_name: msg.trainName || 'Train',
                    train_number: '',
                    lat: msg.latitude,
                    lng: msg.longitude,
                    accuracy: msg.accuracy,
                    speed: msg.speed,
                    heading: msg.heading,
                    updated_at: msg.timestamp || new Date().toISOString(),
                    from_station: '',
                    to_station: ''
                });
            }
            updateAllMarkers();
            loadActiveSchedules();
            if (trackingTrain) followTrackedTrain();
        }

        function handleWsTrainOffline(msg) {
            var trainId = String(msg.trainId);
            activeTrains = activeTrains.filter(function(t) { return String(t.schedule_id) !== trainId; });
            if (trainMarkers[trainId]) {
                map.removeLayer(trainMarkers[trainId].marker);
                delete trainMarkers[trainId];
            }
            loadActiveSchedules();
            if (trackingTrain && trackingTrain.id === trainId) {
                stopTracking();
            }
        }

        function initMap() {
            // Role-aware back link
            var user = window.api.getUser();
            var backLink = document.getElementById('backLink');
            
            var urlParams = new URLSearchParams(window.location.search);
            var isEmbed = urlParams.get('embed') === 'true';
            
            if (!isEmbed) {
                if (user && (user.role === 'admin' || user.role === 'ceylon-track-admin')) {
                    backLink.href = 'admin.html';
                    backLink.textContent = '← Dashboard';
                } else if (user && user.role === 'staff') {
                    backLink.href = 'staff-app.html';
                    backLink.textContent = '← Staff Dashboard';
                } else {
                    backLink.href = 'index.html';
                    backLink.textContent = '← Back Search';
                }
                backLink.style.display = 'inline-block';
            }

            document.getElementById('trackBtn').addEventListener('click', trackTrainFromSelect);

            loadRailwayLines();
            fetchAllActiveTrains().then(function() {
                loadActiveSchedules();
            }).catch(function(){});
            startLiveTimer();
            connectWebSocket();

            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(function() {
                fetchAllActiveTrains().then(function() {
                    loadActiveSchedules();
                }).catch(function(){});
            }, 8000);
        }

        initMap();
    </script>
</body>
</html>
