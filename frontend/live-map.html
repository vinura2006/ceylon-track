<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live GPS Train Map — Ceylon Track</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Theme Detection Script -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('ceylon_track_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <style>
        /* ============================================================
           CEYLON TRACK GLOBAL DESIGN SYSTEM
           ============================================================ */
        :root {
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --surface-2: #F1F5F9;
            --text: #0F172A;
            --text-2: #475569;
            --border: #E2E8F0;
            --primary: #0F4C75;
            --primary-2: #1B6CA8;
            --accent: #00B4D8;
            --accent-2: #0077B6;
            --success: #059669;
            --warning: #D97706;
            --danger: #DC2626;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-blur: blur(12px);
            --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Syne', sans-serif;
        }

        [data-theme="dark"] {
            --bg: #0A0F1E;
            --surface: #111827;
            --surface-2: #1F2937;
            --text: #F9FAFB;
            --text-2: #9CA3AF;
            --border: #374151;
            --primary: #1B6CA8;
            --primary-2: #2196F3;
            --accent: #00D4FF;
            --accent-2: #00B4D8;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            --glass-bg: rgba(17, 24, 39, 0.75);
            --glass-blur: blur(16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Full Screen Map container */
        .map-wrapper {
            position: relative;
            flex: 1;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #map {
            width: 100%;
            height: 100%;
        }

        /* Control Panel Overlay */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 700px;
            background-color: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 1.25rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: all 0.3s;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .nav-link-btn {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-2);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            background: var(--surface-2);
        }
        .nav-link-btn:hover {
            background: var(--border);
        }

        /* Search Actions */
        .controls-row {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 0.5rem;
            align-items: center;
        }

        .select {
            width: 100%;
            min-height: 48px;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--surface);
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 700;
            outline: none;
        }

        .btn {
            min-height: 48px;
            padding: 0.5rem 1rem;
            font-size: 0.95rem;
            font-weight: 800;
            background-color: var(--primary-2);
            color: #FFFFFF;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }

        /* Status & Signal countdown overlays */
        .status-overlay {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .signal-loss-warning {
            background-color: rgba(217, 119, 6, 0.15);
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .info-message-overlay {
            background-color: rgba(15, 76, 117, 0.1);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            display: none;
            text-align: center;
            margin-top: 0.25rem;
        }

        /* Animated live train marker icon */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.65; }
            100% { transform: scale(1); opacity: 1; }
        }
        .live-train-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: rgba(220, 38, 38, 0.25);
            border: 2px solid var(--danger);
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 16px var(--danger);
        }

        /* Back to Home Button Float */
        .theme-btn-float {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: var(--glass-bg);
            border: 1px solid var(--border);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            font-size: 1.25rem;
            z-index: 1000;
        }

        /* Responsive overrides */
        @media (max-width: 600px) {
            .control-panel {
                top: 10px;
                width: calc(100% - 20px);
                padding: 0.85rem;
            }
            .controls-row {
                grid-template-columns: 1fr;
            }
            .panel-title {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <!-- Full Screen Leaflet Map Container -->
    <div class="map-wrapper">
        <div id="map"></div>

        <!-- Float controls Panel overlaid on map -->
        <div class="control-panel">
            <div class="panel-header">
                <span class="panel-title"><span>🛰</span> Ceylon Track — Live Map</span>
                <a href="/index.html" class="nav-link-btn">← Back Search</a>
            </div>

            <div class="controls-row">
                <select id="scheduleSelect" class="select">
                    <option value="">Loading active trains...</option>
                </select>
                <button class="btn" id="trackBtn" onclick="trackTrain()">Track This Train</button>
            </div>

            <div class="status-overlay">
                <span id="liveStatusText">Select a train to begin tracking</span>
                <span id="countdownDisplay">Last updated: --</span>
            </div>

            <!-- Warning Banner overlays -->
            <div class="signal-loss-warning" id="signalWarning"></div>
            <div class="info-message-overlay" id="infoOverlay"></div>
        </div>
    </div>

    <button class="theme-btn-float" id="themeBtn" aria-label="Toggle Theme">🌓</button>

    <script src="/js/api.js"></script>
    <script>
        // 10 Station database
        const STATIONS = [
            { name: 'Colombo Fort', code: 'FOT', lat: 6.9344, lng: 79.8477 },
            { name: 'Kandy', code: 'KAN', lat: 7.2906, lng: 80.6337 },
            { name: 'Galle', code: 'GAL', lat: 6.0535, lng: 80.2170 },
            { name: 'Matara', code: 'MAT', lat: 5.9549, lng: 80.5353 },
            { name: 'Negombo', code: 'NEG', lat: 7.2096, lng: 79.8477 },
            { name: 'Badulla', code: 'BAD', lat: 6.9934, lng: 81.0560 },
            { name: 'Anuradhapura', code: 'ANP', lat: 8.3114, lng: 80.3864 },
            { name: 'Jaffna', code: 'JAF', lat: 9.6615, lng: 80.0137 },
            { name: 'Kurunegala', code: 'KUR', lat: 7.4868, lng: 80.3647 },
            { name: 'Ratnapura', code: 'RAT', lat: 6.6828, lng: 80.4022 }
        ];

        // Map Setup
        const map = L.map('map').setView([7.8731, 80.7718], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Add station circles to map on load
        STATIONS.forEach(station => {
            L.circleMarker([station.lat, station.lng], {
                radius: 6,
                color: '#0077B6',
                fillColor: '#00B4D8',
                fillOpacity: 0.8,
                weight: 2
            }).addTo(map)
              .bindPopup(`<b>🚉 ${station.name} (${station.code})</b>`);
        });

        // Railway Lines GeoJSON loading & Snapping Logic
        let railwayGeoJSON = null;

        async function loadRailwayLines() {
            try {
                const response = await fetch('/js/srilanka_railway.geojson');
                if (!response.ok) throw new Error('Failed to load railway lines');
                railwayGeoJSON = await response.json();

                // Sleepers (wider dark gray line)
                L.geoJSON(railwayGeoJSON, {
                    style: {
                        color: '#475569',
                        weight: 4,
                        opacity: 0.65
                    }
                }).addTo(map);

                // Rails (thinner dashed white/light gray line)
                L.geoJSON(railwayGeoJSON, {
                    style: {
                        color: '#f8fafc',
                        weight: 1.5,
                        dashArray: '5, 5',
                        opacity: 0.9
                    }
                }).addTo(map);

                console.log('Successfully loaded and rendered Sri Lanka railway network.');
            } catch (err) {
                console.error('Error loading railway lines GeoJSON:', err);
            }
        }

        loadRailwayLines();

        function getDistance(lat1, lon1, lat2, lon2) {
            const dy = lat1 - lat2;
            const dx = lon1 - lon2;
            return dy * dy + dx * dx; // Squared distance is fine for comparing closeness
        }

        function projectPointOnSegment(p, a, b) {
            const py = p[0], px = p[1];
            const ay = a[0], ax = a[1];
            const by = b[0], bx = b[1];

            const dx = bx - ax;
            const dy = by - ay;
            const len2 = dx * dx + dy * dy;

            if (len2 === 0) return [ay, ax];

            let t = ((px - ax) * dx + (py - ay) * dy) / len2;
            t = Math.max(0, Math.min(1, t));

            return [ay + t * dy, ax + t * dx];
        }

        function snapToRailway(lat, lng) {
            if (!railwayGeoJSON) return [lat, lng];

            let minDistance = Infinity;
            let snappedPoint = [lat, lng];

            railwayGeoJSON.features.forEach(feature => {
                if (feature.geometry && feature.geometry.type === 'LineString') {
                    const coords = feature.geometry.coordinates; // [lon, lat]
                    for (let i = 0; i < coords.length - 1; i++) {
                        const a = [coords[i][1], coords[i][0]]; // [lat, lon]
                        const b = [coords[i+1][1], coords[i+1][0]]; // [lat, lon]

                        // Bounding box filter (approx 5km buffer) to skip calculations for far away segments
                        const minLat = Math.min(a[0], b[0]) - 0.05;
                        const maxLat = Math.max(a[0], b[0]) + 0.05;
                        const minLng = Math.min(a[1], b[1]) - 0.05;
                        const maxLng = Math.max(a[1], b[1]) + 0.05;
                        
                        if (lat < minLat || lat > maxLat || lng < minLng || lng > maxLng) {
                            continue;
                        }

                        const projected = projectPointOnSegment([lat, lng], a, b);
                        const dist = getDistance(lat, lng, projected[0], projected[1]);

                        if (dist < minDistance) {
                            minDistance = dist;
                            snappedPoint = projected;
                        }
                    }
                }
            });

            // Snap if within roughly 8-10km (0.08 degrees) to prevent snapping bad coordinates
            if (minDistance < 0.08 * 0.08) {
                return snappedPoint;
            }
            return [lat, lng];
        }

        // Theme management
        const themeBtn = document.getElementById('themeBtn');
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('ceylon_track_theme', newTheme);
        });

        // Tracking state variables
        let pollInterval = null;
        let selectedScheduleId = null;
        let trainMarker = null;
        let lastUpdateTime = null;
        let updateTimer = null;

        function showInfo(msg) {
            const overlay = document.getElementById('infoOverlay');
            if (msg) {
                overlay.textContent = msg;
                overlay.style.display = 'block';
            } else {
                overlay.style.display = 'none';
            }
        }

        function showWarning(msg) {
            const warningEl = document.getElementById('signalWarning');
            if (msg) {
                warningEl.innerHTML = `⚠️ ${msg}`;
                warningEl.style.display = 'flex';
            } else {
                warningEl.style.display = 'none';
            }
        }

        // Fetch Live Location of selected Train
        async function fetchTrainLocation() {
            if (!selectedScheduleId) return;

            try {
                const response = await fetch(`/api/gps/${selectedScheduleId}`);
                
                if (response.status === 404) {
                    try {
                        const lsData = await api.getLastStop(selectedScheduleId);
                        showInfo(`No live GPS. Showing last reported manual stop: ${lsData.station_name}`);
                        showWarning(null);

                        const lat = parseFloat(lsData.lat);
                        const lng = parseFloat(lsData.lng);
                        const [snappedLat, snappedLng] = snapToRailway(lat, lng);

                        if (trainMarker) {
                            trainMarker.setLatLng([snappedLat, snappedLng]);
                        } else {
                            const lastStopIcon = L.divIcon({
                                html: '🚉',
                                className: 'live-train-icon',
                                iconSize: [36, 36],
                                iconAnchor: [18, 18],
                                style: 'border-color: #f59e0b; box-shadow: 0 0 16px #f59e0b;'
                            });
                            trainMarker = L.marker([snappedLat, snappedLng], { icon: lastStopIcon }).addTo(map);
                        }

                        trainMarker.bindPopup(`
                            <div style="font-family: var(--font-body); font-size: 14px;">
                                <strong>🚂 Train ${selectedScheduleId}</strong><br>
                                Status: Offline<br>
                                Last Stop: <b>${lsData.station_name}</b><br>
                                Arrival: ${new Date(lsData.arrival_time).toLocaleString()}
                            </div>
                        `).openPopup();
                        
                        map.panTo([snappedLat, snappedLng]);
                        document.getElementById('liveStatusText').textContent = "Offline (Showing Last Stop)";
                        document.getElementById('countdownDisplay').textContent = "Last updated: --";
                    } catch (e) {
                        showInfo("No live GPS data and no last stop data available. Ask staff to start broadcasting.");
                        showWarning(null);
                        if (trainMarker) {
                            map.removeLayer(trainMarker);
                            trainMarker = null;
                        }
                        document.getElementById('liveStatusText').textContent = "Waiting for live broadcast...";
                        document.getElementById('countdownDisplay').textContent = "Last updated: --";
                    }
                    return;
                }

                if (!response.ok) {
                    throw new Error("HTTP error " + response.status);
                }

                const data = await response.json();
                
                showInfo(null);
                lastUpdateTime = new Date();
                
                const lat = data.lat;
                const lng = data.lng;
                const status = data.status || 'ON_TIME';
                const delayMinutes = data.delayMinutes || 0;
                
                const [snappedLat, snappedLng] = snapToRailway(lat, lng);

                document.getElementById('liveStatusText').textContent = `Train ${selectedScheduleId} is Live (${status})`;

                // Render or update train marker
                if (trainMarker) {
                    trainMarker.setLatLng([snappedLat, snappedLng]);
                } else {
                    const pulsingIcon = L.divIcon({
                        html: '🚂',
                        className: 'live-train-icon',
                        iconSize: [36, 36],
                        iconAnchor: [18, 18]
                    });

                    trainMarker = L.marker([snappedLat, snappedLng], { icon: pulsingIcon }).addTo(map);
                }

                // Update popup content dynamically
                const secondsAgo = data.secondsAgo;
                const delayText = status === 'DELAYED' ? ` | Delay: ${delayMinutes} mins` : '';
                const lastStopText = data.lastStopName ? `<br>Last Stop: <b>${data.lastStopName}</b>` : '';
                
                trainMarker.bindPopup(`
                    <div style="font-family: var(--font-body); font-size: 14px;">
                        <strong>🚂 Train ${selectedScheduleId}</strong><br>
                        Status: ${status}${delayText}${lastStopText}<br>
                        Last seen: ${secondsAgo} seconds ago
                    </div>
                `).openPopup();

                // Pan map to follow
                map.panTo([snappedLat, snappedLng]);

            } catch (err) {
                console.error("Fetch GPS error:", err);
                showWarning("Network error: Failed to connect to Ceylon server.");
            }
        }

        // Live timer for updates & signal checks
        function startLiveTimer() {
            if (updateTimer) clearInterval(updateTimer);
            updateTimer = setInterval(() => {
                if (lastUpdateTime) {
                    const diffSeconds = Math.floor((new Date() - lastUpdateTime) / 1000);
                    document.getElementById('countdownDisplay').textContent = `Last updated: ${diffSeconds}s ago`;

                    // Check if update is stale (signal lost warning after 60s)
                    if (diffSeconds > 60) {
                        showWarning(`Signal lost — last seen ${diffSeconds} seconds ago`);
                    } else {
                        showWarning(null);
                    }
                }
            }, 1000);
        }

        // Trigger tracking stream
        function trackTrain() {
            selectedScheduleId = document.getElementById('scheduleSelect').value;
            if (!selectedScheduleId) return;

            showInfo(null);
            showWarning(null);
            
            document.getElementById('liveStatusText').textContent = "Connecting to live GPS stream...";

            // Clean up previous layers
            if (trainMarker) {
                map.removeLayer(trainMarker);
                trainMarker = null;
            }

            // Perform initial fetch immediately
            fetchTrainLocation();

            // Setup polling every 5 seconds
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(fetchTrainLocation, 5000);

            startLiveTimer();
        }

        async function loadActiveSchedules() {
            try {
                const res = await api.getAllActiveTrains();
                const sel = document.getElementById('scheduleSelect');
                sel.innerHTML = '<option value="">Select a Train to Track...</option>';
                if(res.trains) {
                    res.trains.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t.scheduleId;
                        opt.textContent = `🚂 Train ${t.trainNumber} - ${t.trainName} (${t.fromStation} → ${t.toStation})`;
                        sel.appendChild(opt);
                    });
                }
            } catch(e) {
                console.error(e);
            }
        }
        loadActiveSchedules();
    </script>
</body>
</html>
